<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<style>
:root{--bg:#fff;--fg:#111;--card:#f4f4f6;--red:#8b0000;--pur:#6b3fa0;--bd:#ddd;--yel:#ffd400;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0f;--fg:#f2f2f2;--card:#1a1a1e;--bd:#333}}
:root[data-theme=dark]{--bg:#0d0d0f;--fg:#f2f2f2;--card:#1a1a1e;--bd:#333}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;transition:.3s}
button,input,select{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--red);color:#fff;font-weight:bold}
.btn.y{background:var(--yel);color:#000}.btn.p{background:var(--pur)}.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);margin:5px 0}
.box{max-width:430px;margin:6vh auto;padding:24px;border-radius:16px;background:var(--card);border-top:4px solid var(--red);border-bottom:4px solid var(--pur)}
.box h2{margin-top:0}.sm{font-size:.82em}.err{color:#e33;font-size:.85em;min-height:1em}
a.l{color:var(--pur);cursor:pointer;text-decoration:underline}
/* intro */
.tools{position:fixed;top:14px;left:14px;display:flex;gap:8px;align-items:center;z-index:5}
.tool{width:46px;height:60px;animation:fly 2.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes fly{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(5) rotate(var(--r))}40%{opacity:1}100%{opacity:1;transform:none}}
.ent{display:flex;gap:8px;margin-inline-start:10px;animation:fade 1s 2.6s both}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.hero0{height:100vh;display:grid;place-items:center;text-align:center}
.hero0 h1{font-size:clamp(2rem,6vw,3.6rem);margin:0;animation:fade 1.2s 1s both}.hero0 h1 span{color:var(--red)}
/* app */
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--red);position:sticky;top:0;background:var(--bg);z-index:4}
.ham{background:none;border:0;cursor:pointer;display:grid;gap:5px;padding:6px}.ham i{display:block;width:28px;height:3px;background:var(--fg);border-radius:2px}
.bell{position:relative;background:none;border:0;font-size:1.5em;cursor:pointer;color:var(--fg)}
.bell b{position:absolute;top:-2px;right:-4px;background:var(--red);color:#fff;border-radius:50%;font-size:.45em;padding:2px 6px}
.drop{position:absolute;left:12px;top:56px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;width:240px;z-index:6}
.menu{position:fixed;top:0;right:0;height:100%;width:min(300px,85vw);background:var(--card);border-inline-start:4px solid var(--pur);padding:70px 18px 18px;z-index:9;transform:translateX(100%);transition:.3s}
.menu.o{transform:none}.menu a{display:block;padding:14px;border-radius:10px;cursor:pointer;font-weight:bold}.menu a:hover{background:var(--red);color:#fff}
.shade{position:fixed;inset:0;background:#0008;z-index:8}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.sbar{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 10px;max-width:340px}.sbar input{border:0;background:none;margin:0}
.banner{background:linear-gradient(120deg,var(--red),var(--pur));color:#fff;text-align:center;font-size:clamp(1.3rem,4vw,2.2rem);font-weight:900;padding:42px 14px;border-radius:18px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sq{aspect-ratio:1;background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--red);border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.sq:hover{border-bottom-color:var(--pur)}.sq small{opacity:.7}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;flex-wrap:wrap}
.mod{position:fixed;inset:0;background:#000a;z-index:20;display:grid;place-items:center;padding:14px}.mod>div{background:var(--bg);padding:20px;border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;border-top:4px solid var(--red)}
video,iframe{width:100%;border-radius:10px;border:0}

let D=LS.g('db',{users:[],lessons:[{id:1,title:'مقدمة في الكيمياء — Intro to Chemistry'},{id:2,title:'قوانين نيوتن — Newton Laws'}],exams:[],att:{}});

const svg={nb:'<svg viewBox="0 0 46 60"><rect x="4" y="2" width="38" height="56" rx="4" fill="#8b0000"/><rect x="10" y="2" width="32" height="56" rx="3" fill="#fff" stroke="#111"/><path d="M16 14h20M16 24h20M16 34h20" stroke="#6b3fa0" stroke-width="2"/></svg>',

bu:'<svg viewBox="0 0 46 60"><rect x="19" y="2" width="8" height="42" rx="2" fill="#fff" stroke="#111"/><rect x="19" y="20" width="8" height="24" fill="#6b3fa0"/><path d="M19 8h4M19 14h4M19 20h4M19 26h4" stroke="#111"/><path d="M21 44h4l-2 12z" fill="#8b0000"/><rect x="15" y="30" width="16" height="3" fill="#111"/></svg>',
pe:'<svg viewBox="0 0 46 60"><path d="M20 2h6v40l-3 14-3-14z" fill="#ffd400" stroke="#111"/><path d="M20 42h6l-3 14z" fill="#8b0000"/></svg>',
fl:'<svg viewBox="0 0 46 60"><path d="M18 4h10v18l12 30c1 4-1 6-4 6H10c-3 0-5-2-4-6l12-30z" fill="#fff" stroke="#111"/><path d="M12 44h22l4 10H8z" fill="#6b3fa0"/></svg>'};
const tools=()=>`<div class="tools">${[['nb','-60vw','40vh','-200deg',0],['rl','-50vw','30vh','160deg',.25],['bu','-40vw','45vh','-120deg',.5],['pe','-55vw','20vh','300deg',.75],['fl','-45vw','50vh','90deg',1]].map(a=>`<div class="tool" style="--dx:${a[1]};--dy:${a[2]};--r:${a[3]};--d:${a[4]}s">${svg[a[0]]}</div>`).join('')}<div class="ent"><button class="btn y" onclick="go('login')">${t('login')}</button><button class="btn y" onclick="go('signup')">${t('signup')}</button></div></div>`;
const bar=()=>`<div style="padding:10px;text-align:${S.lang==='ar'?'right':'left'}"><a class="l" onclick="go('intro')">← ${t('back')}</a></div>`;
function field(id,k,type='text'){return `<input id="${id}" type="${type}" placeholder="${t(k)}">`}
function R(){theme();const a=$('#app');let h='';
if(S.view==='intro')h=tools()+`<div class="hero0"><h1><span>${t('hero')}</span></h1></div>`;
else if(S.view==='login')h=bar()+`<div class="box"><h2>${t('login')}</h2>${field('u','user','email')}${field('p','pass','password')}<label class="sm"><input type="checkbox" id="rm" style="width:auto"> ${t('rem')}</label><div class="err" id="e"></div><button class="btn" style="width:100%" onclick="doLogin()">${t('login')}</button><p style="text-align:center"><button class="btn g" style="width:100%" onclick="gLogin()">G&nbsp; ${t('google')}</button></p></div>`;
else if(S.view==='signup')h=bar()+`<div class="box"><h2>${t('signup')}</h2>${field('fn','fn')}${field('sn','sn')}${field('fam','fam')}${field('gr','grade')}${field('fp','fp','tel')}${field('mp','mp','tel')}${field('ph','ph','tel')}${field('gm','gm','email')}${field('u','user','email')}${field('p','pass','password')}<div class="err" id="e"></div><button class="btn" style="width:100%" onclick="doSignup()">${t('signup')}</button></div>`;
else h=app();
a.innerHTML=h;if(S.view==='students'&&isT())loadStudents()}
function app(){const v=S.view,ls=vis(),lat=[...ls].sort((x,y)=>y.id-x.id);
const items=[['home','🏠'],['lessons','📖'],['exams','📄'],['perf','📈'],...(isT()?[['students','👥']]:[]),['set','⚙️']];
let h=`<div class="top"><button class="ham" onclick="S.menu=true;R()"><i></i><i></i><i></i></button><span style="font-weight:900;color:var(--red)">${t('brand')}</span><button class="bell" onclick="S.bell=!S.bell;R()">🔔<b>${lat.length}</b></button></div>`;
if(S.bell)h+=`<div class="drop">${lat.slice(0,4).map(l=>`<div class="sm" style="padding:6px 0">📘 ${l.title}</div>`).join('')||`<div class="sm">${t('none')}</div>`}</div>`;
if(S.menu)h+=`<div class="shade" onclick="S.menu=false;R()"></div>`;
h+=`<div class="menu ${S.menu?'o':''}">${items.map(i=>`<a onclick="go('${i[0]}')">${i[1]} ${t(i[0])}</a>`).join('')}<a onclick="logout()">🚪 ${t('out')}</a></div><div class="wrap">`;
if(v==='home'){h+=`<div class="sbar">🔍<input id="q" value="${S.q}" placeholder="${t('search')}" oninput="S.q=this.value;doSearch()"></div><div id="res"></div><div class="banner">${t('dream')}</div><h3>${t('latest')}</h3><div class="grid">${lat.map(l=>`<div class="sq" onclick="view(${l.id})"><span>📘</span><b>${l.title}</b><small>#${l.id}</small></div>`).join('')||`<p>${t('none')}</p>`}</div>`}
if(v==='lessons'){h+=`<h2>${t('lessons')}</h2>${isT()?`<button class="btn" onclick="addLesson()">＋ ${t('addL')}</button>`:''}${ls.map(l=>`<div class="row"><b>📘 ${l.title}</b><div><button class="btn p" onclick="view(${l.id})">${t('open')}</button>${isT()?` <button class="btn" onclick="delItem('lessons',${l.id})">🗑 ${t('del')}</button>`:''}</div></div>`).join('')||`<p>${t('none')}</p>`}`}
if(v==='exams'){h+=`<h2>${t('exams')}</h2>${isT()?`<button class="btn" onclick="addExam()">＋ ${t('addE')}</button>`:''}${D.exams.map(e=>`<div class="row"><div><b>📄 ${e.title}</b><div class="sm">${new Date(e.end).toLocaleString()} · ${e.dur}m · ${e.tries} ${t('tr')}</div></div><div><button class="btn p" onclick="takeExam(${e.id})">${t('open')}</button>${isT()?` <button class="btn" onclick="delItem('exams',${e.id})">🗑 ${t('del')}</button>`:''}</div></div>`).join('')||`<p>${t('none')}</p>`}`}
if(v==='perf'){const n=Object.keys(D.att).filter(k=>k.startsWith(S.user.id+':')).reduce((s,k)=>s+D.att[k],0);h+=`<h2>${t('perf')}</h2><div class="grid"><div class="sq"><span>📖</span><b>${t('lessons')}</b><h2>${ls.length}</h2></div><div class="sq"><span>📄</span><b>${t('exams')}</b><h2>${n}</h2></div></div>`}

return h+'</div>'}
let studentCache=[];
async function loadStudents(){
  const target=$('#st'); if(!target || !isT()) return;
  target.textContent=S.lang==='ar'?'جارٍ تحميل الطلاب...':'Loading students...';
  try{
    const snap=await fsdb.collection('users').get();
    studentCache=snap.docs.map(doc=>{const d=doc.data();return {...d,id:doc.id,u:d.username||d.gm||d.email||''};}).filter(u=>u.role==='s');
    D.users=studentCache;
    const current=$('#st'); if(current) current.innerHTML=stList('');
  }catch(err){
    console.error('Could not load students from Firestore:',err);
    const current=$('#st'); if(current) current.textContent=S.lang==='ar'?'تعذر تحميل الطلاب. تأكد من تسجيل الدخول وقواعد Firestore.':'Could not load students. Check sign-in and Firestore rules.';
  }
}
function stList(q){const f=studentCache.filter(u=>(u.fn||'').concat(' ',u.sn||'',' ',u.fam||'',' ',u.u||'').toLowerCase().includes(q.toLowerCase()));
return f.map(u=>{const b=u.ban&&u.ban>Date.now();return `<div class="row"><div><b>${u.fn} ${u.sn} ${u.fam}</b><div class="sm">${u.gr} · ${u.ph} · 👨 ${u.fp} · 👩 ${u.mp}<br>${u.gm}${b?`<br><span style="color:var(--red)">${t('banned')} ${new Date(u.ban).toLocaleString()}</span>`:''}</div></div><div><button class="btn p" onclick="allow('${u.id}')">＋</button> <button class="btn" onclick="ban('${u.id}')">${b?t('unban'):'⛔ '+t('ban')}</button></div></div>`}).join('')||`<p>${t('nf')}</p>`}
function stFilter(q){const target=$('#st');if(target)target.innerHTML=stList(q)}
async function doLogin(){
  const email=$('#u').value.trim().toLowerCase(), p=$('#p').value, e=$('#e');
  e.textContent='';
  if(!email||!p){e.textContent=t('bad');return}
  try{
    const cred=await auth.signInWithEmailAndPassword(email,p);
    await loadFirebaseProfile(cred.user);
  }catch(err){
    e.textContent=authMessage(err);
  }
}
function authMessage(err){
  if(err.code==='auth/user-not-found'||err.code==='auth/invalid-credential'||err.code==='auth/wrong-password')return t('bad');
  if(err.code==='auth/invalid-email')return S.lang==='ar'?'البريد الإلكتروني غير صحيح':'Invalid email address';
  if(err.code==='auth/too-many-requests')return S.lang==='ar'?'محاولات كثيرة؛ حاول لاحقًا':'Too many attempts; try again later';
  if(err.code==='auth/email-already-in-use')return S.lang==='ar'?'البريد الإلكتروني مسجل بالفعل':'Email already registered';
  return (S.lang==='ar'?'تعذر تسجيل الدخول: ':'Sign-in failed: ')+(err.message||err.code||'Unknown error');
}
async function loadFirebaseProfile(user){
  try{
    const snap=await fsdb.collection('users').doc(user.uid).get();
    const profile=snap.exists?snap.data():{};
    S.user={id:user.uid,role:profile.role==='t'?'t':'s',email:user.email||'',...profile};
    S.view='home';R();startCloudSync();
  }catch(err){
    S.user={id:user.uid,role:'s',email:user.email||''};
    S.view='home';R();startCloudSync();
    console.error('Could not load profile from Firestore:',err);
  }
}
function enter(s){S.user=s;go('home')}
async function gLogin(){
  const provider=new firebase.auth.GoogleAuthProvider();
  try{
    const result=await auth.signInWithPopup(provider);
    const user=result.user;
    const ref=fsdb.collection('users').doc(user.uid);
    const snap=await ref.get();
    if(!snap.exists){
      await ref.set({
        uid:user.uid,
        email:user.email||'',
        fn:user.displayName||'',
        gm:user.email||'',
        role:'s',
        ok:[],
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    await loadFirebaseProfile(user);
  }catch(err){
    const e=$('#e');
    if(e)e.textContent=authMessage(err);
    console.error(err);
  }
}
async function doSignup(){
  const ids=['fn','sn','fam','gr','fp','mp','ph','gm','u','p'],v={};
  ids.forEach(i=>v[i]=$('#'+i).value.trim());
  const e=$('#e');e.textContent='';
  if(ids.some(i=>!v[i])||v.p.length<6||!v.gm.includes('@')){
    e.textContent=t('req');return;
  }
  if(v.u==='1112'){e.textContent=t('taken');return}
  try{
    const cred=await auth.createUserWithEmailAndPassword(v.gm.toLowerCase(),v.p);
    const profile={
      uid:cred.user.uid,
      fn:v.fn,sn:v.sn,fam:v.fam,gr:v.gr,fp:v.fp,mp:v.mp,ph:v.ph,
      gm:v.gm.toLowerCase(),username:v.u,role:'s',ok:[],
      ban:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    await fsdb.collection('users').doc(cred.user.uid).set(profile);
    await loadFirebaseProfile(cred.user);
  }catch(err){
    e.textContent=authMessage(err);
    console.error(err);
  }
}
async function logout(){
  try{await auth.signOut()}catch(err){console.error(err)}
  S.user=null;LS.s('sess',null);go('intro');
}
async function changePassword(){
  const msg=$('#pwerr'),old=$('#oldpw')?.value||'',next=$('#newpw')?.value||'',confirmNext=$('#confpw')?.value||'';
  const ar=S.lang==='ar';
  if(msg)msg.textContent='';
  if(!old||!next||!confirmNext){if(msg)msg.textContent=ar?'املأ كل الحقول.':'Fill in all fields.';return}
  if(next.length<6){if(msg)msg.textContent=ar?'كلمة السر الجديدة لازم تكون 6 أحرف على الأقل.':'New password must be at least 6 characters.';return}
  if(next!==confirmNext){if(msg)msg.textContent=ar?'تأكيد كلمة السر غير مطابق.':'Password confirmation does not match.';return}
  const user=auth.currentUser;
  if(!user||!user.email){if(msg)msg.textContent=ar?'سجّل الدخول مرة أخرى ثم حاول.':'Sign in again and try once more.';return}
  try{
    const credential=firebase.auth.EmailAuthProvider.credential(user.email,old);
    await user.reauthenticateWithCredential(credential);
    await user.updatePassword(next);
    $('#oldpw').value='';$('#newpw').value='';$('#confpw').value='';
    if(msg)msg.textContent=ar?'تم تغيير كلمة السر بنجاح.':'Password changed successfully.';
  }catch(err){
    console.error('Password change failed:',err);
    let message=ar?'تعذر تغيير كلمة السر. تأكد من كلمة السر الحالية.':'Could not change password. Check your current password.';
    if(err.code==='auth/weak-password')message=ar?'كلمة السر ضعيفة. اختر كلمة سر أقوى.':'Password is too weak. Choose a stronger password.';
    else if(err.code==='auth/too-many-requests')message=ar?'محاولات كثيرة؛ حاول لاحقًا.':'Too many attempts. Try again later.';
    else if(err.code==='auth/network-request-failed')message=ar?'تحقق من اتصال الإنترنت.':'Check your internet connection.';
    else if(err.code==='auth/requires-recent-login')message=ar?'سجّل الخروج ثم ادخل مرة أخرى وحاول.':'Sign out, sign in again, and retry.';
    if(msg)msg.textContent=message;
  }
}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const c=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=c}}return m[b.length]}
function doSearch(){const q=S.q.trim().toLowerCase(),r=$('#res');if(!q){r.innerHTML='';return}
const ls=vis(),hit=ls.filter(l=>l.title.toLowerCase().includes(q));let out=hit,note='';
if(!hit.length&&ls.length){const best=ls.map(l=>({l,d:Math.min(...l.title.toLowerCase().split(/\s+/).map(w=>lev(q,w)))})).sort((a,b)=>a.d-b.d)[0];out=[best.l];note=t('best')+': '}
r.innerHTML=out.map(l=>`<div class="row"><b>${note}📘 ${l.title}</b><button class="btn p" onclick="view(${l.id})">${t('open')}</button></div>`).join('')||`<p>${t('nf')}</p>`}
function modal(h){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div>${h}<p><button class="btn g" onclick="this.closest('.mod').remove()">${t('close')}</button></p></div>`;document.body.appendChild(m);return m}
function view(id){const l=D.lessons.find(x=>String(x.id)===String(id));if(!l)return;let content=`<h3>${esc(l.title)}</h3>`;
if(l.url)content+=`<p><a class="btn p" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${S.lang==='ar'?'اضغط للمشاهدة':'Click to watch'}</a></p>`;
if(l.v)content+=`<video controls playsinline src="${esc(l.v)}"></video>`;
if(l.p)content+=`<p><a class="btn g" href="${esc(l.p)}" target="_blank" rel="noopener noreferrer">${S.lang==='ar'?'فتح / تحميل ملف PDF':'Open / download PDF'}</a></p>`;
if(!l.url&&!l.v&&!l.p)content+=`<p class="sm">—</p>`;modal(content)}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addLesson(){modal(`<h3>${t('addL')}</h3>${field('lt','title')}<label class="sm">${S.lang==='ar'?'رابط الدرس أو الفيديو (اختياري)':'Lesson/video URL (optional)'}</label><input id="lu" type="url" placeholder="https://..."><label class="sm">${t('video')} (${S.lang==='ar'?'اختياري':'optional'})</label><input id="lv" type="file" accept="video/*"><label class="sm">${t('pdf')} (${S.lang==='ar'?'اختياري':'optional'})</label><input id="lp" type="file" accept="application/pdf"><p class="sm">${S.lang==='ar'?'قد يستغرق رفع الفيديو وقتًا حسب حجمه وسرعة الإنترنت.':'Video upload time depends on file size and connection.'}</p><div class="err" id="lessonerr"></div><button class="btn" onclick="saveLesson(this)">${t('save')}</button>`)}
async function saveLesson(b){const ti=$('#lt').value.trim(),url=$('#lu').value.trim(),vf=$('#lv').files[0],pf=$('#lp').files[0],msg=$('#lessonerr');if(!ti){if(msg)msg.textContent=S.lang==='ar'?'اكتب عنوان الدرس أولًا.':'Enter a lesson title.';return}if(url&&!/^https?:\/\//i.test(url)){if(msg)msg.textContent=S.lang==='ar'?'الرابط لازم يبدأ بـ https:// أو http://':'URL must start with https:// or http://';return}if(!url&&!vf&&!pf){if(msg)msg.textContent=S.lang==='ar'?'أضف رابطًا أو فيديو أو ملف PDF واحدًا على الأقل.':'Add a URL, video, or PDF file.';return}
if(!isT()||!auth.currentUser){if(msg)msg.textContent=S.lang==='ar'?'يجب تسجيل الدخول بحساب المدرّس.':'Sign in with the teacher account.';return}
const btn=b;b.disabled=true;btn.textContent=S.lang==='ar'?'جارٍ الحفظ والرفع...':'Saving and uploading...';
try{const id=String(Date.now()),lesson={id,title:ti,url:url||'',v:'',p:'',createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:auth.currentUser.uid};
if(vf){const ref=storage.ref().child(`lessons/${id}/${Date.now()}_${vf.name.replace(/[^\w.\-]/g,'_')}`);const task=ref.put(vf);await task;lesson.v=await ref.getDownloadURL()}
if(pf){const ref=storage.ref().child(`lessons/${id}/${Date.now()}_${pf.name.replace(/[^\w.\-]/g,'_')}`);const task=ref.put(pf);await task;lesson.p=await ref.getDownloadURL()}
await fsdb.collection('lessons').doc(id).set(lesson);b.closest('.mod').remove();await refreshCloudOnce();R();
}catch(err){console.error('Lesson save failed:',err);if(msg)msg.textContent=(S.lang==='ar'?'فشل الحفظ: ':'Save failed: ')+(err.code||err.message||'Unknown error')+'. '+(S.lang==='ar'?'تحقق من قواعد Firestore وStorage.':'Check Firestore and Storage rules.');btn.disabled=false;btn.textContent=t('save')}}
async function refreshCloudOnce(){try{const [ls,es]=await Promise.all([fsdb.collection('lessons').get(),fsdb.collection('exams').get()]);D.lessons=ls.docs.map(d=>({...d.data(),id:d.id}));D.exams=es.docs.map(d=>({...d.data(),id:d.id}));}catch(e){console.error('Cloud refresh failed:',e)}}
function startCloudSync(){if(!auth.currentUser)return;if(lessonUnsub)lessonUnsub();if(examUnsub)examUnsub();lessonUnsub=fsdb.collection('lessons').orderBy('createdAt','desc').onSnapshot(snap=>{D.lessons=snap.docs.map(d=>({...d.data(),id:d.id}));if(S.user&&['home','lessons','exams'].includes(S.view))R()},err=>console.error('Lessons sync:',err));examUnsub=fsdb.collection('exams').onSnapshot(snap=>{D.exams=snap.docs.map(d=>({...d.data(),id:d.id}));if(S.user&&['home','lessons','exams'].includes(S.view))R()},err=>console.error('Exams sync:',err))}
function allow(uid){const u=D.users.find(x=>x.id===uid);modal(`<h3>${t('allow')}</h3>${D.lessons.map(l=>`<label class="row"><span>${l.title}</span><input type="checkbox" style="width:auto" ${u.ok.includes(l.id)?'checked':''} onchange="tog('${uid}',${l.id},this.checked)"></label>`).join('')}`)}
function tog(uid,lid,on){const u=D.users.find(x=>x.id===uid);u.ok=u.ok.filter(i=>i!==lid);if(on)u.ok.push(lid);save()}
function ban(uid){const u=D.users.find(x=>x.id===uid);u.ban=(u.ban&&u.ban>Date.now())?0:Date.now()+864e5;save();R()}
function addExam(){modal(`<h3>${t('addE')}</h3>${field('et','title')}<label class="sm">${t('end')}</label><input id="ee" type="datetime-local">${field('ed','dur','number')}${field('en','tries','number')}<div class="err" id="examerr"></div><button class="btn" onclick="saveExam(this)">${t('save')}</button>`)}
async function saveExam(b){const x={id:String(Date.now()),title:$('#et').value.trim(),end:new Date($('#ee').value).getTime(),dur:+$('#ed').value,tries:+$('#en').value,createdBy:auth.currentUser?.uid||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()};const msg=$('#examerr');if(!x.title||!x.end||!x.dur||!x.tries){if(msg)msg.textContent=S.lang==='ar'?'املأ كل الحقول بقيم صحيحة.':'Fill all fields with valid values.';return}try{await fsdb.collection('exams').doc(x.id).set(x);b.closest('.mod').remove();await refreshCloudOnce();R()}catch(e){console.error(e);if(msg)msg.textContent=(S.lang==='ar'?'فشل حفظ الاختبار: ':'Could not save exam: ')+(e.code||e.message)}}
function takeExam(id){const e=D.exams.find(x=>x.id===id);if(isT()){modal(`<h3>${e.title}</h3>`);return}
const k=S.user.id+':'+id,n=D.att[k]||0;if(Date.now()>e.end)return modal(`<p>${t('closed')}</p>`);if(n>=e.tries)return modal(`<p>${t('nomore')}</p>`);
D.att[k]=n+1;save();modal(`<h3>${e.title}</h3><p>${t('started')} ${e.dur}</p><p class="sm">${n+1} / ${e.tries}</p>`)}
S.user=null;S.view='intro';theme();R();
auth.onAuthStateChanged(async user=>{
  if(user){await loadFirebaseProfile(user);startCloudSync()}
  else{S.user=null;if(S.view!=='login'&&S.view!=='signup')S.view='intro';R()}
});
</script></body></html>
