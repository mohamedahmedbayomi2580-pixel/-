const tools=()=>`<div class="tools">${[['nb','-60vw','40vh','-200deg',0],['rl','-50vw','30vh','160deg',.25],['bu','-40vw','45vh','-120deg',.5],['pe','-55vw','20vh','300deg',.75],['fl','-45vw','50vh','90deg',1]].map(a=>`<div class="tool" style="--dx:${a[1]};--dy:${a[2]};--r:${a[3]};--d:${a[4]}s">${svg[a[0]]}</div>`).join('')}<div class="ent"><button class="btn y" onclick="go('login')">${t('login')}</button><button class="btn y" onclick="go('signup')">${t('signup')}</button></div></div>`;

a.innerHTML=`<main>${h}</main>${footer()}`;

const teacherCards=()=>D.teachers.filter(x=>x.id!==S.user.id).map(x=>{const j=(S.user.teachers||[]).includes(x.id),p=D.myReqs.some(r=>r.teacherId===x.id);return `<div class="row"><div class="who">${av(x)}<b>${esc(x.name)}</b></div><div>${j?`<span class="badge g">${t('joined')}</span>`:p?`<span class="sm">${t('pending')}</span> <button class="btn g s" onclick="cancelReq('${esc(x.id)}')">✖</button>`:`<button class="btn p" onclick="askGrade('${esc(x.id)}')">${t('joinReq')}</button>`}</div></div>`}).join('')||`<p>${t('noT')}</p>`;
function app(){const v=S.view,ls=[...D.lessons].sort(byNew),T_=isT();
const items=T_?[['home','🏠'],['lessons','📖'],['exams','📄'],['students','👥'],...(isAdmin()?[['teachers','🧑‍🏫']]:[]),['set','⚙️']]:[['home','🏠'],['teachers','🧑‍🏫'],['lessons','📖'],['exams','📄'],['perf','📈'],['set','⚙️']];
const watch=l=>`<button class="btn p" onclick="view('${esc(l.id)}')">▶ ${t('watch')}</button>`;
let h=`<div class="top"><button class="ham" onclick="S.menu=true;R()"><i></i><i></i><i></i></button><span class="brandN" style="font-weight:900;color:var(--red)">${brand()}</span><div style="display:flex;align-items:center;gap:8px"><button class="avbtn" onclick="myPhoto()" title="${t('profileT')}">${avSm(myCard())}</button><button class="bell" onclick="toggleBell()">🔔${T_?`<b>${ls.length}</b>`:((D.msgs||[]).some(m=>!m.read)?`<b>${(D.msgs||[]).filter(m=>!m.read).length}</b>`:'')}</button></div></div>`;
if(S.bell)h+=`<div class="drop">${T_?'':(D.msgs||[]).map(noteH).join('')}${ls.slice(0,4).map(l=>`<div class="sm" style="padding:6px 0">📘 ${esc(l.title)}</div>`).join('')||((!T_&&(D.msgs||[]).length)?'':`<div class="sm">${t('none')}</div>`)}</div>`;
if(S.menu)h+=`<div class="shade" onclick="S.menu=false;R()"></div>`;
h+=`<div class="menu ${S.menu?'o':''}">${items.map(i=>`<a onclick="go('${i[0]}')">${i[1]} ${t(i[0])}</a>`).join('')}<a onclick="logout()">🚪 ${t('out')}</a></div><div class="wrap">`;

if(v==='home'){
  if(T_)h+=`<div class="grid" style="margin-top:14px"><div class="tile" onclick="go('students')">👥<h2>${D.students.length}</h2>${t('myStudents')}</div><div class="tile" onclick="go('students')">📨<h2>${D.reqs.length}</h2>${t('reqs')}</div><div class="tile" onclick="go('lessons')">📖<h2>${ls.length}</h2>${t('lessons')}</div><div class="tile" onclick="go('exams')">📄<h2>${D.exams.length}</h2>${t('exams')}</div></div>`;
  else h+=`<h3 style="margin-bottom:0">🧑‍🏫 ${t('availT')} (${D.teachers.length})</h3><p class="sm" style="margin-top:4px">${(S.user.teachers||[]).length?'':t('noJoin')}</p>${teacherCards()}`;
  h+=`<div class="sbar" style="margin-top:12px">🔍<input id="q" value="${esc(S.q)}" placeholder="${t('search')}" oninput="S.q=this.value;doSearch()"></div><div id="res"></div><div class="banner">${t('dream')}</div><h3>${t('latest')}</h3><div class="grid">${ls.map(l=>`<div class="sq" onclick="view('${esc(l.id)}')"><span>📘</span><b>${esc(l.title)}</b><small>▶ ${t('watch')}</small></div>`).join('')||`<p>${t('none')}</p>`}</div>`}

if(v==='teachers'){
  if(isAdmin()){h+=`<h2>${t('teachers')}</h2><button class="btn" onclick="teacherForm()">＋ ${t('addT')}</button>${D.teachers.map(x=>`<div class="row"><div class="who">${av(x)}<div><b>${esc(x.name)}</b>${x.id===S.user.id?` <span class="badge">${t('mainT')}</span>`:''}<div class="sm">${t('sCount')}: <b id="cnt_${esc(x.id)}">…</b></div></div></div><div><button class="btn g s" onclick="teacherForm('${esc(x.id)}')">✏️ ${t('editT')}</button> <button class="btn g s" onclick="resetTeacherPw('${esc(x.id)}')">🔑 ${t('resetT')}</button>${x.id!==S.user.id?` <button class="btn s" onclick="delTeacher('${esc(x.id)}')">🗑</button>`:''}</div></div>`).join('')||`<p>${t('noT')}</p>`}`}
  else{h+=`<h2>${t('availT')}</h2><p class="sm">${t('pickT')}</p>${teacherCards()}`}
}

if(v==='lessons'){const gs=[...D.groups].sort(byNew);
  const row=l=>`<div class="row"><b>📘 ${esc(l.title)}${l.grade?` <span class="badge">🎓 ${gname(l.grade)}</span>`:''}</b><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${watch(l)}${T_?`<select style="width:auto;margin:0" onchange="moveLesson('${esc(l.id)}',this.value)"><option value="">${t('noGroup')}</option>${gs.map(g=>`<option value="${esc(g.id)}" ${l.groupId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><button class="btn s" onclick="delItem('lessons','${esc(l.id)}')">🗑</button>`:''}</div></div>`;
  h+=`<h2>${t('lessons')}</h2>${T_?`<button class="btn" onclick="addLesson()">＋ ${t('addL')}</button> <button class="btn p" onclick="newGroup()">${t('newGroup')}</button>`:''}`;
  gs.forEach(g=>{const arr=ls.filter(l=>l.groupId===g.id);h+=`<div class="grp"><h3>📁 ${esc(g.name)} (${arr.length})</h3>${T_?`<button class="btn s" onclick="delGroup('${esc(g.id)}')">🗑 ${t('del')}</button>`:''}</div>${arr.map(row).join('')||`<p class="sm">—</p>`}`});
  const rest=ls.filter(l=>!l.groupId||!gs.some(g=>g.id===l.groupId));
  if(rest.length||!gs.length)h+=(gs.length?`<div class="grp"><h3>${t('noGroup')}</h3></div>`:'')+(rest.map(row).join('')||`<p>${t('none')}</p>`)}

if(v==='exams'){h+=`<h2>${t('exams')}</h2>${T_?`<button class="btn" onclick="addExam()">＋ ${t('addE')}</button>`:''}`;
  h+=[...D.exams].filter(e=>T_||!e.grade||e.grade===myGrade(e.teacherId)).sort(byNew).map(e=>{
    const mine=D.subs.filter(s=>s.examId===e.id);
    if(T_)return `<div class="row"><div><b>📄 ${esc(e.title)}</b><div class="sm">${new Date(e.end).toLocaleString()} · ${e.dur}m · ${e.tries} ${t('attempts')} · ${(e.qs||[]).length} ?${e.grade?' · 🎓 '+gname(e.grade):' · 🎓 '+t('allGrades')}</div></div><div><button class="btn p s" onclick="review('${esc(e.id)}')">${t('answers')} (${mine.length})</button> <button class="btn s" onclick="delItem('exams','${esc(e.id)}')">🗑</button></div></div>`;
    const gr=[...mine].filter(s=>s.grade!=null).sort((a,b)=>tsec(b.at)-tsec(a.at))[0],tc=D.teachers.find(x=>x.id===e.teacherId);
    return `<div class="row"><div><b>📄 ${esc(e.title)}</b>${tc?` <span class="sm">· ${esc(tc.name)}</span>`:''}<div class="sm">${new Date(e.end).toLocaleString()} · ${e.dur}m · ${t('attempts')}: ${mine.length}/${e.tries}</div>${gr?`<div class="ok">${t('yourGrade')}: <b>${esc(gr.grade)}</b>${gr.comment?' — '+esc(gr.comment):''}</div>`:mine.length?`<div class="sm">${t('waiting')}</div>`:''}</div><div><button class="btn p" onclick="startExam('${esc(e.id)}')">${t('start')}</button></div></div>`}).join('')||`<p>${t('none')}</p>`}

if(v==='perf'){const subs=[...D.subs].sort((a,b)=>tsec(b.at)-tsec(a.at));h+=`<h2>${t('perf')}</h2><div class="grid"><div class="tile">📖<h2>${ls.length}</h2>${t('lessons')}</div><div class="tile">📄<h2>${subs.length}</h2>${t('exams')}</div></div><h3>${t('exams')}</h3>${subs.map(s=>{const e=D.exams.find(x=>x.id===s.examId);return `<div class="row"><div><b>${esc(e?e.title:'')}</b><div class="sm">${esc(tstr(s.at))}</div></div><div>${s.grade!=null?`<span class="badge g">${t('yourGrade')}: ${esc(s.grade)}</span>${s.comment?`<div class="sm">${esc(s.comment)}</div>`:''}`:`<span class="sm">${t('waiting')}</span>`}</div></div>`}).join('')||`<p>${t('none')}</p>`}`}

if(v==='set')h+=`<h2>${t('set')}</h2><div class="row"><b>${t('lang')}</b><select style="width:auto" onchange="S.lang=this.value;LS.s('lang',S.lang);R()"><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option><option value="en" ${S.lang==='en'?'selected':''}>English</option></select></div><div class="row"><b>${t('theme')}</b><div><button class="btn g" onclick="S.theme='light';LS.s('theme','light');R()">☀️ ${t('light')}</button> <button class="btn g" onclick="S.theme='dark';LS.s('theme','dark');R()">🌙 ${t('dark')}</button></div></div>${T_?`<div class="row"><b>${t('myProfile')}</b><button class="btn p" onclick="teacherForm('${esc(S.user.id)}')">✏️</button></div>`:''}${isAdmin()?`<h3>🏷️ ${t('brandT')}</h3><input id="bn" maxlength="40" value="${esc(S.brand||t('brand'))}"><div class="err" id="bnerr"></div><button class="btn p" onclick="saveBrand(this)">${t('save')}</button>`:''}<h3>🔒 ${t('cp')}</h3><input id="oldpw" type="password" autocomplete="current-password" placeholder="${t('cpOld')}"><input id="newpw" type="password" autocomplete="new-password" placeholder="${t('cpNew')}"><input id="confpw" type="password" autocomplete="new-password" placeholder="${t('cpConf')}"><div class="err" id="pwerr"></div><button class="btn p" onclick="changePassword()">${t('cpSave')}</button>`;

if(v==='students'){const adm=isAdmin(),src=adm?D.all:D.students;
  h+=`<h2>${adm?t('allStudents'):t('myStudents')} (${src.length}) ${adm?`<button class="btn g s" onclick="loadAllStudents()">⟳ ${t('refresh')}</button>`:''}</h2>${D.reqs.length?`<h3>📨 ${t('reqs')} (${D.reqs.length})</h3>${D.reqs.map(r=>`<div class="row"><div><b>${esc(r.name)}</b> <span class="badge">🎓 ${gname(r.grade||'')}</span></div><div><button class="btn p s" onclick="acceptReq('${esc(r.id)}')">${t('accept')}</button> <button class="btn s" onclick="rejectReq('${esc(r.id)}')">${t('reject')}</button></div></div>`).join('')}`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="sbar">🔍<input id="sq" value="${esc(S.sq)}" placeholder="${t('searchS')}" oninput="S.sq=this.value;drawStudents()"></div>${adm?`<select style="width:auto" onchange="S.ft=this.value;drawStudents()"><option value="">${t('allT')}</option>${D.teachers.map(x=>`<option value="${esc(x.id)}" ${S.ft===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}</div><div id="st">${stList(S.sq)}</div>`}
return h+'</div>'}

/* ---------- students (teacher) ---------- */
function stList(q){const src=isAdmin()?D.all:D.students;
const f=src.filter(u=>[u.fn,u.sn,u.fam,u.gm,u.ph].join(' ').toLowerCase().includes((q||'').toLowerCase())&&(!S.ft||(u.teachers||[]).includes(S.ft)));
S.sel=S.sel||{};const vis=f.map(u=>u.id);S.vis=vis;const nsel=vis.filter(i=>S.sel[i]).length;
const tb=f.length?`<div class="row"><label class="who" style="cursor:pointer"><input type="checkbox" style="width:auto;margin:0" ${nsel===vis.length?'checked':''} onchange="selAll(this.checked)"><b>${t('selAll')} (${nsel}/${vis.length})</b></label><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn p s" ${nsel?'':'disabled'} onclick="msgStudents(selIds())">💌 ${t('msgSel')}</button><button class="btn s" ${nsel?'':'disabled'} onclick="delStudents(selIds())">🗑 ${t('delSel')}</button><button class="btn s" style="background:#444" onclick="delAll()">⚠️ ${t('delAll')}</button></div></div>`:'';
const rowH=u=>{const b=u.ban&&u.ban>Date.now();
const gn=D.groups.filter(g=>(g.allowed||[]).includes(u.id)).map(g=>'📁 '+esc(g.name));
const ln=D.lessons.filter(l=>(l.allowed||[]).includes(u.id)).map(l=>esc(l.title));
const tn=(u.teachers||[]).map(id=>{const x=D.teachers.find(z=>z.id===id);return x?esc(x.name):''}).filter(Boolean).join('، ');
return `<div class="row" style="align-items:flex-start"><div class="who" style="flex:1;min-width:230px;align-items:flex-start"><input type="checkbox" style="width:auto;margin:18px 0 0" ${S.sel[u.id]?'checked':''} onchange="selS('${esc(u.id)}',this.checked)">${av({photo:u.photo,name:u.fn})}<div><b>${esc(u.fn)} ${esc(u.sn)} ${esc(u.fam)}</b><div class="sm" style="line-height:1.9">✉️ ${esc(u.gm||u.email)}<br>📱 ${esc(u.ph)} · 👨 ${esc(u.fp)}<br>${t('joinedAt')}: ${esc(tstr(u.createdAt))}<br>🎓 ${gradeSel(u)}${tn?`<br>🧑‍🏫 ${tn}`:''}<br>${t('allowedN')}: ${[...gn,...ln].join('، ')||'—'}${b?`<br><span style="color:var(--red)">${t('banned')} ${new Date(u.ban).toLocaleString()}</span>`:''}</div></div></div><div style="display:grid;gap:6px"><button class="btn p s" onclick="allow('${esc(u.id)}')">＋ ${t('lessons')}</button><button class="btn s" onclick="ban('${esc(u.id)}')">${b?t('unban'):'⛔ '+t('ban')}</button><button class="btn g s" onclick="resetPw('${esc(u.id)}')">🔑 ${t('resetPw')}</button><button class="btn p s" onclick="msgStudents(['${esc(u.id)}'])">💌 ${t('msg')}</button><button class="btn s" onclick="delStudents(['${esc(u.id)}'])">🗑 ${t('del')}</button></div></div>`};
const gOf=u=>(u.grades||{})[gradeKey()]||'';
return tb+['1','2','3',''].map(g=>{const a=f.filter(u=>gOf(u)===g);return a.length?`<div class="grp"><h3>🎓 ${gname(g)} (${a.length})</h3></div>`+a.map(rowH).join(''):''}).join('')||`<p>${t('nf')}</p>`}
function drawStudents(){const c=$('#st');if(c)c.innerHTML=stList(S.sq)}
function allow(sid){const u=(isAdmin()?D.all:D.students).find(x=>x.id===sid);if(!u)return;
modal(`<h3>${t('allow')}</h3><div class="sm">${esc(u.fn)} ${esc(u.fam)}</div>${D.groups.length?`<h4>📁 ${t('grantG')}</h4>${[...D.groups].sort(byNew).map(g=>`<label class="row"><span>📁 ${esc(g.name)}</span><input type="checkbox" style="width:auto" ${(g.allowed||[]).includes(sid)?'checked':''} onchange="togG('${esc(sid)}','${esc(g.id)}',this)"></label>`).join('')}`:''}<h4>📘 ${t('grantL')}</h4>${[...D.lessons].sort(byNew).map(l=>`<label class="row"><span>${esc(l.title)}</span><input type="checkbox" style="width:auto" ${(l.allowed||[]).includes(sid)?'checked':''} onchange="tog('${esc(sid)}','${esc(l.id)}',this)"></label>`).join('')||`<p>${t('none')}</p>`}`)}
async function togG(sid,gid,box){try{await fsdb.collection('groups').doc(gid).update({allowed:box.checked?FV.arrayUnion(sid):FV.arrayRemove(sid)});const g=D.groups.find(x=>x.id===gid);g.allowed=(g.allowed||[]).filter(i=>i!==sid);if(box.checked)g.allowed.push(sid)}catch(e){console.error(e);box.checked=!box.checked;alert(t('errG')+' '+(e.code||''))}}
async function tog(sid,lid,box){try{await fsdb.collection('lessons').doc(lid).update({allowed:box.checked?FV.arrayUnion(sid):FV.arrayRemove(sid)});const l=D.lessons.find(x=>x.id===lid);l.allowed=(l.allowed||[]).filter(i=>i!==sid);if(box.checked)l.allowed.push(sid)}catch(e){console.error(e);box.checked=!box.checked;alert(t('errG')+' '+(e.code||''))}}
async function ban(uid){const u=(isAdmin()?D.all:D.students).find(x=>x.id===uid);const nb=(u.ban&&u.ban>Date.now())?0:Date.now()+864e5;
  try{await fsdb.collection('users').doc(uid).update({ban:nb});u.ban=nb;drawStudents()}catch(e){console.error(e);alert(t('errG')+' '+(e.code||''))}}
async function resetPw(uid){const u=(isAdmin()?D.all:D.students).find(x=>x.id===uid);const em=u&&(u.gm||u.email);if(!em)return;
  try{await auth.sendPasswordResetEmail(em);modal(`<p class="ok">${t('resetSent')}</p><p class="sm">${esc(em)}<br>${t('explain')}</p>`)}catch(e){console.error(e);alert(t('errG')+' '+(e.code||''))}}
async function acceptReq(rid){const r=D.reqs.find(x=>x.id===rid);if(!r)return;const me=S.user.id,g=r.grade||'';
  try{const up={teachers:FV.arrayUnion(me)};if(g)up['grades.'+me]=g;
    await fsdb.collection('users').doc(r.studentId).update(up);
    const ops=[];if(g)D.lessons.filter(l=>l.grade===g).forEach(l=>ops.push(b=>b.update(fsdb.collection('lessons').doc(l.id),{allowed:FV.arrayUnion(r.studentId)})));
    ops.push(b=>b.delete(fsdb.collection('requests').doc(rid)));await commitOps(ops);
    if(isAdmin())loadAllStudents()}catch(e){console.error(e);alert(t('errG')+' '+(e.code||''))}}
async function rejectReq(rid){try{await fsdb.collection('requests').doc(rid).delete()}catch(e){console.error(e)}}
function askGrade(tid){modal(`<h3>🎓 ${t('pickGrade')}</h3><select id="gsel"><option value="1">${t('g1')}</option><option value="2">${t('g2')}</option><option value="3">${t('g3')}</option></select><button class="btn" style="width:100%;margin-top:10px" onclick="sendReq('${esc(tid)}',$('#gsel').value,this)">${t('joinReq')}</button>`)}
async function sendReq(tid,g,b){if(!['1','2','3'].includes(g))return;if(b)b.disabled=true;try{await fsdb.collection('requests').doc(S.user.id+'_'+tid).set({studentId:S.user.id,teacherId:tid,name:fullName(),grade:g,createdAt:FV.serverTimestamp()});if(b)b.closest('.mod').remove();rerender()}catch(e){console.error(e);alert(t('errG')+' '+(e.code||''));if(b)b.disabled=false}}
async function cancelReq(tid){try{await fsdb.collection('requests').doc(S.user.id+'_'+tid).delete()}catch(e){console.error(e)}}

/* ---------- admin helpers ---------- */
async function loadAllStudents(){try{const s=await fsdb.collection('users').where('role','==','s').get();D.all=s.docs.map(mk);D.allLoaded=true;if(S.view==='students')drawStudents()}catch(e){console.error(e)}}

function imgToData(file,max=200,lim=0){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.85,o=c.toDataURL('image/jpeg',q);while(lim&&o.length>lim&&q>.35){q-=.1;o=c.toDataURL('image/jpeg',q)}if(lim&&o.length>lim)return rej(new Error('big'));res(o)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- auth ---------- */
function authMessage(err){const c=err.code||'';
  if(['auth/user-not-found','auth/invalid-credential','auth/wrong-password'].includes(c))return t('bad');
  if(c==='auth/invalid-email')return S.lang==='ar'?'البريد الإلكتروني غير صحيح':'Invalid email address';
  if(c==='auth/email-already-in-use')return S.lang==='ar'?'البريد الإلكتروني مسجل بالفعل':'Email already registered';
  if(c==='auth/too-many-requests')return S.lang==='ar'?'محاولات كثيرة؛ حاول لاحقًا':'Too many attempts; try later';
  if(c==='auth/operation-not-allowed')return S.lang==='ar'?'فعّل Email/Password من Firebase ← Authentication':'Enable Email/Password in Firebase Authentication';
  if(c==='auth/unauthorized-domain')return S.lang==='ar'?'ضيف دومين الموقع في Authentication ← Settings ← Authorized domains':'Add this domain in Authorized domains';
  if(c==='auth/network-request-failed')return S.lang==='ar'?'تحقق من الإنترنت':'Check your connection';
  return (S.lang==='ar'?'حدث خطأ: ':'Error: ')+(c||err.message);}
async function doLogin(){
  const e=$('#e');e.textContent='';const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
  const email=u==='1112'?TEACHER:u;if(!email||p.length<6){e.textContent=t('bad');return}

    let cred;

      if(err0.code!=='auth/email-already-in-use')throw err0;
      /* الإيميل له حساب قديم في Authentication (مثلاً طالب اتحذف): نجرّب ندخل بنفس كلمة السر ونعيد إنشاء بياناته */

      const ex=await fsdb.collection('users').doc(cred.user.uid).get();

async function changePassword(){
  const msg=$('#pwerr'),old=$('#oldpw').value,next=$('#newpw').value,conf=$('#confpw').value,ar=S.lang==='ar';msg.className='err';msg.textContent='';
  if(!old||!next||!conf){msg.textContent=ar?'املأ كل الحقول.':'Fill in all fields.';return}
  if(next.length<6){msg.textContent=ar?'كلمة السر الجديدة 6 أحرف على الأقل.':'New password must be 6+ characters.';return}
  if(next!==conf){msg.textContent=ar?'تأكيد كلمة السر غير مطابق.':'Confirmation does not match.';return}
  const user=auth.currentUser;if(!user||!user.email){msg.textContent=ar?'سجّل الدخول مرة أخرى.':'Sign in again.';return}
  try{await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,old));await user.updatePassword(next);
    $('#oldpw').value=$('#newpw').value=$('#confpw').value='';msg.className='ok';msg.textContent=ar?'تم تغيير كلمة السر بنجاح ✓':'Password changed ✓'}
  catch(err){console.error(err);const c=err.code;msg.textContent=c==='auth/weak-password'?(ar?'كلمة السر ضعيفة.':'Password too weak.'):c==='auth/too-many-requests'?(ar?'محاولات كثيرة؛ حاول لاحقًا.':'Too many attempts.'):(ar?'تعذر التغيير. تأكد من كلمة السر الحالية.':'Could not change. Check current password.')}
}

function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const c=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=c}}return m[b.length]}
function doSearch(){const q=S.q.trim().toLowerCase(),r=$('#res');if(!q){r.innerHTML='';return}
const ls=D.lessons,hit=ls.filter(l=>String(l.title).toLowerCase().includes(q));let out=hit,note='';
if(!hit.length&&ls.length){const best=ls.map(l=>({l,d:Math.min(...String(l.title).toLowerCase().split(/\s+/).map(w=>lev(q,w)))})).sort((a,b)=>a.d-b.d)[0];out=[best.l];note=t('best')+': '}
r.innerHTML=out.map(l=>`<div class="row"><b>${note}📘 ${esc(l.title)}</b><button class="btn p" onclick="view('${esc(l.id)}')">▶ ${t('watch')}</button></div>`).join('')||`<p>${t('nf')}</p>`}

  try{await fsdb.collection('exams').doc(String(Date.now())).set({...x,qs,teacherId:S.user.id,createdAt:FV.serverTimestamp()});b.closest('.mod').remove();rerender()}catch(e){console.error(e);msg.textContent=t('errG')+' '+(e.code||e.message);b.disabled=false}}
function review(eid){const e=D.exams.find(x=>x.id===eid);if(!e)return;const subs=D.subs.filter(s=>s.examId===eid).sort((a,b)=>tsec(b.at)-tsec(a.at));
  modal(`<h3>${esc(e.title)}</h3>${subs.map(s=>`<div class="q"><b>${esc(s.name)}</b> <span class="sm">${esc(tstr(s.at))}</span>${(e.qs||[]).map((q,i)=>`<div class="sm" style="margin:8px 0"><b>${i+1}. ${esc(q.q)}</b><br>↳ ${esc((s.answers||[])[i]||'—')}</div>`).join('')}<div style="display:flex;gap:6px;flex-wrap:wrap"><input id="g_${esc(s.id)}" type="number" step="any" placeholder="${t('gradeL')}" value="${s.grade!=null?esc(s.grade):''}" style="max-width:110px"><input id="c_${esc(s.id)}" placeholder="${t('comment')}" value="${esc(s.comment||'')}" style="flex:1;min-width:120px"><button class="btn p s" onclick="saveGrade('${esc(s.id)}',this)">${t('gsave')}</button></div></div>`).join('')||`<p>${t('noSubs')}</p>`}`)}
async function saveGrade(sid,b){const g=parseFloat($('#g_'+sid).value),c=$('#c_'+sid).value.trim();if(isNaN(g)){alert(t('gradeL'));return}
  try{await fsdb.collection('submissions').doc(sid).update({grade:g,comment:c});const s=D.subs.find(x=>x.id===sid);if(s){s.grade=g;s.comment=c}b.textContent='✓'}catch(e){console.error(e);alert(t('errG')+' '+(e.code||''))}}
async function startExam(id){const e=D.exams.find(x=>x.id===id);if(!e)return;
  if(Date.now()>e.end)return modal(`<p>${t('closed')}</p>`);
  if(!(e.qs||[]).length)return modal(`<h3>${esc(e.title)}</h3><p>${t('noQ')}</p>`);
  const sref=fsdb.collection('examState').doc(e.id+'_'+S.user.id);let n=0;
  try{const s=await sref.get();n=s.exists?s.data().count:0}catch(err){console.error(err)}
  if(n>=e.tries)return modal(`<p>${t('nomore')}</p>`);
  const subId=fsdb.collection('submissions').doc().id;
  try{n?await sref.update({count:n+1,lastSub:subId}):await sref.set({studentId:S.user.id,examId:e.id,count:1,lastSub:subId})}catch(err){console.error(err);return modal(`<p>${t('closed')}</p>`)}
  const m=modal(`<h3>${esc(e.title)}</h3><p>${t('left')}: <b id="tm"></b></p>${e.qs.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b>${(q.o&&q.o.length)?q.o.map((o,j)=>`<label><input type="radio" name="a${i}" value="${j}"> ${esc(o)}</label>`).join(''):`<textarea id="ans${i}" rows="3"></textarea>`}</div>`).join('')}<button class="btn" id="sb">${t('submit')}</button>`);
  let left=e.dur*60,done=false,iv;
  const submit=async()=>{if(done)return;done=true;clearInterval(iv);
    const answers=e.qs.map((q,i)=>{if(q.o&&q.o.length){const r=m.querySelector(`input[name=a${i}]:checked`);return r?q.o[+r.value]:''}return(m.querySelector('#ans'+i)||{value:''}).value.trim()});
    try{await fsdb.collection('submissions').doc(subId).set({studentId:S.user.id,examId:e.id,teacherId:e.teacherId,name:fullName(),answers,at:FV.serverTimestamp()});m.querySelector('div').innerHTML=`<h3 class="ok">${t('sent')}</h3><button class="btn g" onclick="this.closest('.mod').remove();rerender()">${t('close')}</button>`}
    catch(err){console.error(err);m.querySelector('div').innerHTML=`<p class="err">${t('errG')} ${esc(err.code||'')}</p><button class="btn g" onclick="this.closest('.mod').remove();rerender()">${t('close')}</button>`}};
  iv=setInterval(()=>{if(!document.body.contains(m)){clearInterval(iv);return}const tm=$('#tm');if(tm)tm.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left--<=0)submit()},1000);
  $('#sb').onclick=submit}

/* ---------- photo viewer ---------- */
let LBz=1;
function myPhoto(){const c=myCard();if(c&&c.photo)zoomImg(c.photo,true);else profile()}
function zoomImg(src,canChange){if(!src)return;LBz=1;
  const d=document.createElement('div');d.className='lb';
  d.innerHTML=`<div class="lbt"><button class="btn y s" onclick="lbZ(.5)">＋</button><button class="btn y s" onclick="lbZ(-.5)">－</button><button class="btn g s" onclick="lbZ(0)">1:1</button>${canChange?`<button class="btn p s" onclick="this.closest('.lb').remove();profile()">✏️ ${t('changePhoto')}</button>`:''}<button class="btn s" onclick="this.closest('.lb').remove();rerender()">✖ ${t('close')}</button></div><div class="lbb" onclick="if(event.target===this){this.closest('.lb').remove();rerender()}"><img id="lbi" src="${esc(src)}" alt=""></div>`;
  document.body.appendChild(d);lbZ(0);
  d.querySelector('.lbb').addEventListener('wheel',e=>{e.preventDefault();lbZ(e.deltaY<0?.25:-.25)},{passive:false});
  d.querySelector('#lbi').onclick=()=>lbZ(LBz>1?-9:1.5)}
function lbZ(dl){const im=document.getElementById('lbi');if(!im)return;LBz=dl===0?1:Math.min(5,Math.max(1,LBz+dl));im.style.width=Math.round(Math.min(innerWidth*.9,innerHeight*.7,480)*LBz)+'px';im.style.cursor=LBz>1?'zoom-out':'zoom-in'}

/* ---------- messages (stickers) ---------- */
const COLORS=['#fff176','#ffab91','#a5d6a7','#90caf9','#ce93d8'];let MSGIDS=[];
function noteH(m){const fresh=!m.read||(S.fresh||[]).includes(m.id);return `<div class="note" style="background:${esc(m.color||COLORS[0])}"><button class="nx" onclick="delMsg('${esc(m.id)}')">✖</button><div class="nh">📌 ${esc(m.teacherName||t('teacherL'))}${fresh?` <span class="nw">${t('newL')}</span>`:''}</div><div class="nt">${esc(m.text)}</div><div class="nd">${esc(tstr(m.createdAt))}</div></div>`}
function toggleBell(){S.bell=!S.bell;if(S.bell&&!isT())S.fresh=(D.msgs||[]).filter(m=>!m.read).map(m=>m.id);else S.fresh=[];R();if(S.bell&&!isT())markRead()}
async function markRead(){const un=(D.msgs||[]).filter(m=>!m.read);if(!un.length)return;try{const b=fsdb.batch();un.forEach(m=>b.update(fsdb.collection('messages').doc(m.id),{read:true}));await b.commit()}catch(e){console.error(e)}}
async function delMsg(id){try{await fsdb.collection('messages').doc(id).delete()}catch(e){console.error(e)}}
function msgStudents(ids){ids=[...ids];if(!ids.length)return;MSGIDS=ids;const src=isAdmin()?D.all:D.students;
  const names=ids.map(i=>{const u=src.find(x=>x.id===i);return u?(u.fn+' '+(u.fam||'')).trim():''}).filter(Boolean);
  modal(`<h3>💌 ${t('msg')}</h3><div class="sm">${t('to')}: <b>${esc(names.slice(0,5).join('، '))}${names.length>5?' +'+(names.length-5):''}</b></div><textarea id="mt" rows="4" maxlength="400" placeholder="${t('msgText')}"></textarea><div class="sm">${t('stickerColor')}</div><div style="display:flex;gap:10px;margin:6px 0 10px">${COLORS.map((c,i)=>`<label style="cursor:pointer;display:flex;align-items:center;gap:4px"><input type="radio" name="mc" value="${c}" ${i?'':'checked'} style="width:auto;margin:0"><span style="width:26px;height:26px;border-radius:6px;display:inline-block;border:1px solid #0004;background:${c}"></span></label>`).join('')}</div><div class="err" id="merr"></div><button class="btn" onclick="sendMsg(this)">${t('send')}</button>`)}
async function sendMsg(b){const tx=$('#mt').value.trim(),er=$('#merr');if(!tx){er.textContent=t('msgText');return}
  const col=(document.querySelector('input[name=mc]:checked')||{}).value||COLORS[0],nm=((D.teachers.find(x=>x.id===S.user.id)||{}).name)||S.user.name||'';
  b.disabled=true;
  try{const step=isAdmin()?400:15;
    for(let i=0;i<MSGIDS.length;i+=step){const bt=fsdb.batch();MSGIDS.slice(i,i+step).forEach(sid=>bt.set(fsdb.collection('messages').doc(),{studentId:sid,teacherId:S.user.id,teacherName:nm,text:tx,color:col,read:false,createdAt:FV.serverTimestamp()}));await bt.commit()}
    b.closest('.mod').remove();modal(`<p class="ok">${t('msgSent')}</p>`)}
  catch(e){console.error(e);er.textContent=t('errG')+' '+(e.code||'');b.disabled=false}}

/* ---------- select / delete students ---------- */
function selS(id,v){S.sel=S.sel||{};if(v)S.sel[id]=1;else delete S.sel[id];drawStudents()}
function selAll(v){S.sel={};if(v)(S.vis||[]).forEach(i=>S.sel[i]=1);drawStudents()}
const selIds=()=>(S.vis||[]).filter(i=>S.sel&&S.sel[i]);
function delStudents(ids){ids=[...ids];if(!ids.length)return;
  const m=(ids.length>1?t('confirmDelN').replace('{n}',ids.length):t('confirmDelOne'))+'\n\n'+(isAdmin()?t('delNoteA'):t('delNoteT'));
  if(!confirm(m))return;doDel(ids)}
function delAll(){const n=(S.vis||[]).length;if(!n)return;
  if(!confirm(t('confirmAll').replace('{n}',n)+'\n\n'+(isAdmin()?t('delNoteA'):t('delNoteT'))))return;
  if(!confirm(t('confirmAll2')))return;doDel([...S.vis])}
async function doDel(ids){const me=S.user.id,adm=isAdmin(),ops=[],c=n=>fsdb.collection(n);
  ids.forEach(id=>{
    if(adm)ops.push(b=>b.delete(c('users').doc(id)));
    else{ops.push(b=>b.update(c('users').doc(id),{teachers:FV.arrayRemove(me)}));
      D.lessons.filter(l=>(l.allowed||[]).includes(id)).forEach(l=>ops.push(b=>b.update(c('lessons').doc(l.id),{allowed:FV.arrayRemove(id)})));
      D.groups.filter(g=>(g.allowed||[]).includes(id)).forEach(g=>ops.push(b=>b.update(c('groups').doc(g.id),{allowed:FV.arrayRemove(id)})))}});
  try{for(let i=0;i<ops.length;i+=400){const b=fsdb.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}
    S.sel={};if(adm)D.all=D.all.filter(u=>!ids.includes(u.id));else D.students=D.students.filter(u=>!ids.includes(u.id));
    drawStudents();alert(t('deleted'))}
  catch(e){console.error(e);alert(t('errG')+' '+(e.code||''))}}

/* ---------- grades ---------- */
const gname=g=>g==='1'?t('g1'):g==='2'?t('g2'):g==='3'?t('g3'):t('noGrade');
const gradeOpts=extra=>['1','2','3'].map(g=>`<option value="${g}">${gname(g)}</option>`).join('')+`<option value="">${extra}</option>`;
const myGrade=tid=>((S.user&&S.user.grades)||{})[tid]||'';
const gradeKey=()=>isAdmin()?(S.ft||S.user.id):S.user.id;
function gradeSel(u){const cur=(u.grades||{})[gradeKey()]||'';return `<select style="width:auto;margin:0;padding:2px 8px" onchange="setGrade('${esc(u.id)}',this.value)"><option value="" disabled ${cur?'':'selected'}>${t('noGrade')}</option>${['1','2','3'].map(g=>`<option value="${g}" ${cur===g?'selected':''}>${gname(g)}</option>`).join('')}</select>`}
async function commitOps(ops){for(let i=0;i<ops.length;i+=400){const b=fsdb.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}}
async function setGrade(uid,g){if(!['1','2','3'].includes(g))return;const me=S.user.id,gk=gradeKey(),u=(isAdmin()?D.all:D.students).find(x=>x.id===uid);if(!u)return;
  const old=(u.grades||{})[gk]||'';if(old===g)return;
  try{await fsdb.collection('users').doc(uid).update({['grades.'+gk]:g});u.grades={...(u.grades||{}),[gk]:g};
    if(gk===me){const ops=[],ref=id=>fsdb.collection('lessons').doc(id);
      D.lessons.forEach(l=>{if(old&&l.grade===old)ops.push(b=>b.update(ref(l.id),{allowed:FV.arrayRemove(uid)}));if(l.grade===g)ops.push(b=>b.update(ref(l.id),{allowed:FV.arrayUnion(uid)}))});
      await commitOps(ops)}
    drawStudents()}
  catch(e){console.error(e);alert(t('errG')+' '+(e.code||''));drawStudents()}}

/* ---------- platform name ---------- */
const brand=()=>S.brand||t('brand');
function applyBrand(){document.title=brand();document.querySelectorAll('.brandN').forEach(e=>e.textContent=brand())}
async function saveBrand(b){const v=$('#bn').value.trim().slice(0,40),m=$('#bnerr');b.disabled=true;
  try{await fsdb.collection('settings').doc('app').set({name:v});m.className='ok';m.textContent=t('brandSaved')}
  catch(e){console.error(e);m.className='err';m.textContent=t('errG')+' '+(e.code||'')}b.disabled=false}
fsdb.collection('settings').doc('app').onSnapshot(sn=>{const n=sn.exists?(sn.data().name||''):'';S.brand=n;LS.s('brand',n);applyBrand()},e=>console.error('brand',e));

theme();R();applyBrand();
auth.onAuthStateChanged(user=>{if(user){if(!S.user&&!SIGNING)afterLogin(user)}else if(S.user){stop();S.user=null;S.view='intro';R()}});
</script></body></html>
