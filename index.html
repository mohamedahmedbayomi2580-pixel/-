<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة ماناسا</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f4f4f6;--red:#8b0000;--pur:#6b3fa0;--bd:#ddd;--yel:#ffd400;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0f;--fg:#f2f2f2;--card:#1a1a1e;--bd:#333}}
:root[data-theme=dark]{--bg:#0d0d0f;--fg:#f2f2f2;--card:#1a1a1e;--bd:#333}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;transition:.3s}
#app{min-height:100vh;display:flex;flex-direction:column}main{flex:1}
button,input,select{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--red);color:#fff;font-weight:bold}
.btn.y{background:var(--yel);color:#000}.btn.p{background:var(--pur)}.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}.btn:disabled{opacity:.5}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);margin:5px 0}
.box{max-width:430px;margin:6vh auto;padding:24px;border-radius:16px;background:var(--card);border-top:4px solid var(--red);border-bottom:4px solid var(--pur)}
.box h2{margin-top:0}.sm{font-size:.82em}.err{color:#e33;font-size:.85em;min-height:1em}.ok{color:#1a8a3a;font-size:.9em}
a.l{color:var(--pur);cursor:pointer;text-decoration:underline}
.tools{position:fixed;top:14px;left:14px;display:flex;gap:8px;align-items:center;z-index:5}
.tool{width:46px;height:60px;animation:fly 2.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes fly{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(5) rotate(var(--r))}40%{opacity:1}100%{opacity:1;transform:none}}
.ent{display:flex;gap:8px;margin-inline-start:10px;animation:fade 1s 2.6s both}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.hero0{min-height:80vh;display:grid;place-items:center;text-align:center}
.hero0 h1{font-size:clamp(2rem,6vw,3.6rem);margin:0;animation:fade 1.2s 1s both;color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--red);position:sticky;top:0;background:var(--bg);z-index:4}
.ham{background:none;border:0;cursor:pointer;display:grid;gap:5px;padding:6px}.ham i{display:block;width:28px;height:3px;background:var(--fg);border-radius:2px}
.bell{position:relative;background:none;border:0;font-size:1.5em;cursor:pointer;color:var(--fg)}
.bell b{position:absolute;top:-2px;right:-4px;background:var(--red);color:#fff;border-radius:50%;font-size:.45em;padding:2px 6px}
.drop{position:absolute;left:12px;top:56px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;width:240px;z-index:6}
.menu{position:fixed;top:0;right:0;height:100%;width:min(300px,85vw);background:var(--card);border-inline-start:4px solid var(--pur);padding:70px 18px 18px;z-index:9;transform:translateX(100%);transition:.3s}
.menu.o{transform:none}.menu a{display:block;padding:14px;border-radius:10px;cursor:pointer;font-weight:bold}.menu a:hover{background:var(--red);color:#fff}
.shade{position:fixed;inset:0;background:#0008;z-index:8}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.sbar{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 10px;max-width:340px}.sbar input{border:0;background:none;margin:0}
.banner{background:linear-gradient(120deg,var(--red),var(--pur));color:#fff;text-align:center;font-size:clamp(1.3rem,4vw,2.2rem);font-weight:900;padding:42px 14px;border-radius:18px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sq{aspect-ratio:1;background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--red);border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.sq:hover{border-bottom-color:var(--pur)}.sq small{opacity:.7}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;flex-wrap:wrap}
.mod{position:fixed;inset:0;background:#000a;z-index:20;display:grid;place-items:center;padding:14px}.mod>div{background:var(--bg);padding:20px;border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;border-top:4px solid var(--red)}
.foot{text-align:center;padding:18px 12px;font-size:.9em;border-top:3px solid var(--pur);margin-top:30px;background:var(--card)}.foot a{color:var(--pur);font-weight:bold;text-decoration:none}

en:{brand:'Manasa Platform',hero:'Your Education Is the Foundation',login:'Log in',signup:'Sign up',user:'Email or username',uname:'Username',pass:'Password (min 6 chars)',google:'Sign in with Google',fn:'First name',sn:'Second name',fam:'Family name',grade:'School year',fp:"Father's phone",mp:"Mother's phone",ph:'Personal phone',gm:'Google email',back:'Back',home:'Home',lessons:'Lessons',exams:'Exams',perf:'Performance',set:'Settings',out:'Log out',students:'Students',search:'Search for a lesson',searchS:'Search students',dream:'You can achieve your dream',latest:'Latest lessons',lang:'Language',theme:'Theme',light:'Light',dark:'Dark',none:'Nothing available for you yet',del:'Delete',addL:'Add lesson',addE:'Add exam',title:'Title',save:'Save',end:'Exam end time',dur:'Duration (minutes)',tries:'Allowed attempts',open:'Open',watch:'Click to watch',ban:'Ban 1 day',unban:'Unban',allow:'Lessons allowed for this student',bad:'Wrong email or password',banned:'This account is banned until',req:'Fill every field (password 6+ chars)',closed:'Exam has ended',nomore:'No attempts left',started:'Exam started, minutes:',tr:'attempts',nf:'No results',close:'Close',best:'Closest match',dev:'Developer',contact:'Contact',devName:'Mohamed Ahmed',joined:'Joined',allowedN:'Allowed lessons',cp:'Change password',cpOld:'Current password',cpNew:'New password (min 6 chars)',cpConf:'Confirm new password',cpSave:'Save new password',loading:'Loading...'}};
let D={lessons:[],exams:[],users:[],att:LS.g('att',{})};
let S={lang:LS.g('lang','ar'),theme:LS.g('theme','auto'),view:'intro',user:null,menu:false,bell:false,q:''};
const t=k=>T[S.lang][k]||k,$=s=>document.querySelector(s),saveAtt=()=>LS.s('att',D.att);
const isT=()=>S.user&&S.user.role==='t';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const byNew=(a,b)=>Number(b.id)-Number(a.id);
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme);r.lang=S.lang;document.body.dir=S.lang==='ar'?'rtl':'ltr'}
function go(v){S.view=v;S.menu=false;S.bell=false;R()}
const svg={nb:'<svg viewBox="0 0 46 60"><rect x="4" y="2" width="38" height="56" rx="4" fill="#8b0000"/><rect x="10" y="2" width="32" height="56" rx="3" fill="#fff" stroke="#111"/><path d="M16 14h20M16 24h20M16 34h20" stroke="#6b3fa0" stroke-width="2"/></svg>',
rl:'<svg viewBox="0 0 46 60"><rect x="14" y="2" width="18" height="56" rx="2" fill="#ffd400" stroke="#111"/><path d="M14 10h8M14 18h12M14 26h8M14 34h12M14 42h8M14 50h12" stroke="#111"/></svg>',
bu:'<svg viewBox="0 0 46 60"><rect x="19" y="2" width="8" height="42" rx="2" fill="#fff" stroke="#111"/><rect x="19" y="20" width="8" height="24" fill="#6b3fa0"/><path d="M19 8h4M19 14h4M19 20h4M19 26h4" stroke="#111"/><path d="M21 44h4l-2 12z" fill="#8b0000"/><rect x="15" y="30" width="16" height="3" fill="#111"/></svg>',
pe:'<svg viewBox="0 0 46 60"><path d="M20 2h6v40l-3 14-3-14z" fill="#ffd400" stroke="#111"/><path d="M20 42h6l-3 14z" fill="#8b0000"/></svg>',
fl:'<svg viewBox="0 0 46 60"><path d="M18 4h10v18l12 30c1 4-1 6-4 6H10c-3 0-5-2-4-6l12-30z" fill="#fff" stroke="#111"/><path d="M12 44h22l4 10H8z" fill="#6b3fa0"/></svg>'};
const tools=()=>`<div class="tools">${[['nb','-60vw','40vh','-200deg',0],['rl','-50vw','30vh','160deg',.25],['bu','-40vw','45vh','-120deg',.5],['pe','-55vw','20vh','300deg',.75],['fl','-45vw','50vh','90deg',1]].map(a=>`<div class="tool" style="--dx:${a[1]};--dy:${a[2]};--r:${a[3]};--d:${a[4]}s">${svg[a[0]]}</div>`).join('')}<div class="ent"><button class="btn y" onclick="go('login')">${t('login')}</button><button class="btn y" onclick="go('signup')">${t('signup')}</button></div></div>`;
const bar=()=>`<div style="padding:10px"><a class="l" onclick="go('intro')">${S.lang==='ar'?'→':'←'} ${t('back')}</a></div>`;
const field=(id,k,type='text')=>`<input id="${id}" type="${type}" placeholder="${t(k)}" autocomplete="off">`;
const footer=()=>`<div class="foot">${t('dev')}: <b>${t('devName')}</b> &nbsp;|&nbsp; ${t('contact')}: <a href="tel:01020939471" dir="ltr">01020939471</a> &nbsp;<a href="https://wa.me/201020939471" target="_blank" rel="noopener">WhatsApp</a></div>`;

function R(){theme();const a=$('#app');let h='';
if(S.view==='intro')h=tools()+`<div class="hero0"><h1>${t('hero')}</h1></div>`;
else if(S.view==='login')h=bar()+`<div class="box"><h2>${t('login')}</h2>${field('u','user','text')}${field('p','pass','password')}<div class="err" id="e"></div><button class="btn" style="width:100%" onclick="doLogin()">${t('login')}</button><p style="text-align:center"><button class="btn g" style="width:100%" onclick="gLogin()">G&nbsp; ${t('google')}</button></p></div>`;
else if(S.view==='signup')h=bar()+`<div class="box"><h2>${t('signup')}</h2>${field('fn','fn')}${field('sn','sn')}${field('fam','fam')}${field('gr','grade')}${field('fp','fp','tel')}${field('mp','mp','tel')}${field('ph','ph','tel')}${field('gm','gm','email')}${field('u','uname')}${field('p','pass','password')}<div class="err" id="e"></div><button class="btn" style="width:100%" onclick="doSignup()">${t('signup')}</button></div>`;
else h=app();
a.innerHTML=`<main>${h}</main>${footer()}`;if(S.view==='students'&&isT())loadStudents()}

function app(){const v=S.view,ls=[...D.lessons].sort(byNew);
const items=[['home','🏠'],['lessons','📖'],['exams','📄'],['perf','📈'],...(isT()?[['students','👥']]:[]),['set','⚙️']];
const watch=l=>`<button class="btn p" onclick="view('${esc(l.id)}')">▶ ${t('watch')}</button>`;
let h=`<div class="top"><button class="ham" onclick="S.menu=true;R()"><i></i><i></i><i></i></button><span style="font-weight:900;color:var(--red)">${t('brand')}</span><button class="bell" onclick="S.bell=!S.bell;R()">🔔<b>${ls.length}</b></button></div>`;
if(S.bell)h+=`<div class="drop">${ls.slice(0,4).map(l=>`<div class="sm" style="padding:6px 0">📘 ${esc(l.title)}</div>`).join('')||`<div class="sm">${t('none')}</div>`}</div>`;
if(S.menu)h+=`<div class="shade" onclick="S.menu=false;R()"></div>`;
h+=`<div class="menu ${S.menu?'o':''}">${items.map(i=>`<a onclick="go('${i[0]}')">${i[1]} ${t(i[0])}</a>`).join('')}<a onclick="logout()">🚪 ${t('out')}</a></div><div class="wrap">`;
if(v==='home')h+=`<div class="sbar">🔍<input id="q" value="${esc(S.q)}" placeholder="${t('search')}" oninput="S.q=this.value;doSearch()"></div><div id="res"></div><div class="banner">${t('dream')}</div><h3>${t('latest')}</h3><div class="grid">${ls.map(l=>`<div class="sq" onclick="view('${esc(l.id)}')"><span>📘</span><b>${esc(l.title)}</b><small>▶ ${t('watch')}</small></div>`).join('')||`<p>${t('none')}</p>`}</div>`;
if(v==='lessons')h+=`<h2>${t('lessons')}</h2>${isT()?`<button class="btn" onclick="addLesson()">＋ ${t('addL')}</button>`:''}${ls.map(l=>`<div class="row"><b>📘 ${esc(l.title)}</b><div>${watch(l)}${isT()?` <button class="btn" onclick="delItem('lessons','${esc(l.id)}')">🗑 ${t('del')}</button>`:''}</div></div>`).join('')||`<p>${t('none')}</p>`}`;
if(v==='exams')h+=`<h2>${t('exams')}</h2>${isT()?`<button class="btn" onclick="addExam()">＋ ${t('addE')}</button>`:''}${D.exams.map(e=>`<div class="row"><div><b>📄 ${esc(e.title)}</b><div class="sm">${new Date(e.end).toLocaleString()} · ${e.dur}m · ${e.tries} ${t('tr')}</div></div><div><button class="btn p" onclick="takeExam('${esc(e.id)}')">${t('open')}</button>${isT()?` <button class="btn" onclick="delItem('exams','${esc(e.id)}')">🗑 ${t('del')}</button>`:''}</div></div>`).join('')||`<p>${t('none')}</p>`}`;
if(v==='perf'){const n=Object.keys(D.att).filter(k=>k.startsWith(S.user.id+':')).reduce((s,k)=>s+D.att[k],0);h+=`<h2>${t('perf')}</h2><div class="grid"><div class="sq"><span>📖</span><b>${t('lessons')}</b><h2>${ls.length}</h2></div><div class="sq"><span>📄</span><b>${t('exams')}</b><h2>${n}</h2></div></div>`}
if(v==='set')h+=`<h2>${t('set')}</h2><div class="row"><b>${t('lang')}</b><select style="width:auto" onchange="S.lang=this.value;LS.s('lang',S.lang);R()"><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option><option value="en" ${S.lang==='en'?'selected':''}>English</option></select></div><div class="row"><b>${t('theme')}</b><div><button class="btn g" onclick="S.theme='light';LS.s('theme','light');R()">☀️ ${t('light')}</button> <button class="btn g" onclick="S.theme='dark';LS.s('theme','dark');R()">🌙 ${t('dark')}</button></div></div><h3>🔒 ${t('cp')}</h3><input id="oldpw" type="password" autocomplete="current-password" placeholder="${t('cpOld')}"><input id="newpw" type="password" autocomplete="new-password" placeholder="${t('cpNew')}"><input id="confpw" type="password" autocomplete="new-password" placeholder="${t('cpConf')}"><div class="err" id="pwerr"></div><button class="btn p" onclick="changePassword()">${t('cpSave')}</button>`;
if(v==='students')h+=`<h2>${t('students')} <small id="cnt"></small></h2><div class="sbar">🔍<input id="sq" placeholder="${t('searchS')}" oninput="stFilter(this.value)"></div><div id="st">${t('loading')}</div>`;
return h+'</div>'}

/* ---------- students (teacher) ---------- */
let studentCache=[],stQ='';
async function loadStudents(){
  if(!$('#st')||!isT())return;
  try{
    const snap=await fsdb.collection('users').get();
    studentCache=snap.docs.map(d=>({...d.data(),id:d.id,ok:d.data().ok||[]})).filter(u=>u.role==='s');
    drawStudents();
  }catch(err){console.error(err);const c=$('#st');if(c)c.textContent=S.lang==='ar'?'تعذر تحميل الطلاب. تأكد من نشر قواعد Firestore.':'Could not load students. Publish the Firestore rules.'}
}
function drawStudents(){const c=$('#st');if(c)c.innerHTML=stList(stQ);const n=$('#cnt');if(n)n.textContent='('+studentCache.length+')'}
function stFilter(q){stQ=q;drawStudents()}
function stList(q){const f=studentCache.filter(u=>[u.fn,u.sn,u.fam,u.username,u.gm,u.ph].join(' ').toLowerCase().includes(q.toLowerCase()));
return f.map(u=>{const b=u.ban&&u.ban>Date.now();const j=u.createdAt&&u.createdAt.toDate?u.createdAt.toDate().toLocaleDateString():'';
const names=u.ok.map(id=>{const l=D.lessons.find(x=>x.id===id);return l?esc(l.title):null}).filter(Boolean).join('، ');
return `<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:220px"><b>${esc(u.fn)} ${esc(u.sn)} ${esc(u.fam)}</b><div class="sm" style="line-height:1.9">🎓 ${esc(u.gr)}<br>📱 ${esc(u.ph)} · 👨 ${esc(u.fp)} · 👩 ${esc(u.mp)}<br>✉️ ${esc(u.gm||u.email)} · 👤 ${esc(u.username)}<br>${t('joined')}: ${esc(j)}<br>${t('allowedN')} (${u.ok.length}): ${names||'—'}${b?`<br><span style="color:var(--red)">${t('banned')} ${new Date(u.ban).toLocaleString()}</span>`:''}</div></div><div><button class="btn p" onclick="allow('${esc(u.id)}')">＋ ${S.lang==='ar'?'الدروس':'Lessons'}</button> <button class="btn" onclick="ban('${esc(u.id)}')">${b?t('unban'):'⛔ '+t('ban')}</button></div></div>`}).join('')||`<p>${t('nf')}</p>`}
function allow(uid){const u=studentCache.find(x=>x.id===uid);if(!u)return;
modal(`<h3>${t('allow')}</h3><div class="sm">${esc(u.fn)} ${esc(u.fam)}</div>${[...D.lessons].sort(byNew).map(l=>`<label class="row"><span>${esc(l.title)}</span><input type="checkbox" style="width:auto" ${u.ok.includes(l.id)?'checked':''} onchange="tog('${esc(uid)}','${esc(l.id)}',this)"></label>`).join('')||`<p>${t('none')}</p>`}`)}
async function tog(uid,lid,box){const u=studentCache.find(x=>x.id===uid);const next=u.ok.filter(i=>i!==lid);if(box.checked)next.push(lid);
  try{await fsdb.collection('users').doc(uid).update({ok:next});u.ok=next;drawStudents()}catch(e){console.error(e);box.checked=!box.checked;alert((S.lang==='ar'?'تعذر الحفظ: ':'Could not save: ')+(e.code||e.message))}}
async function ban(uid){const u=studentCache.find(x=>x.id===uid);const nb=(u.ban&&u.ban>Date.now())?0:Date.now()+864e5;
  try{await fsdb.collection('users').doc(uid).update({ban:nb});u.ban=nb;drawStudents()}catch(e){console.error(e);alert(e.code||e.message)}}

/* ---------- auth ---------- */
function authMessage(err){const c=err.code||'';
  if(['auth/user-not-found','auth/invalid-credential','auth/wrong-password'].includes(c))return t('bad');
  if(c==='auth/invalid-email')return S.lang==='ar'?'البريد الإلكتروني غير صحيح':'Invalid email address';
  if(c==='auth/email-already-in-use')return S.lang==='ar'?'البريد الإلكتروني مسجل بالفعل':'Email already registered';
  if(c==='auth/too-many-requests')return S.lang==='ar'?'محاولات كثيرة؛ حاول لاحقًا':'Too many attempts; try later';
  if(c==='auth/operation-not-allowed')return S.lang==='ar'?'فعّل Email/Password من Firebase ← Authentication ← Sign-in method':'Enable Email/Password in Firebase Authentication';
  if(c==='auth/unauthorized-domain')return S.lang==='ar'?'ضيف دومين الموقع في Authentication ← Settings ← Authorized domains':'Add this domain in Authorized domains';
  if(c==='auth/network-request-failed')return S.lang==='ar'?'تحقق من الإنترنت':'Check your connection';
  return (S.lang==='ar'?'حدث خطأ: ':'Error: ')+(c||err.message);}
async function doLogin(){
  const e=$('#e');e.textContent='';let u=$('#u').value.trim().toLowerCase();const p=$('#p').value;
  const email=u==='1112'?TEACHER:u;if(!email||p.length<6){e.textContent=t('bad');return}
  let cred;
  try{cred=await auth.signInWithEmailAndPassword(email,p)}
  catch(err){
    if(email===TEACHER){try{cred=await auth.createUserWithEmailAndPassword(TEACHER,p)}catch(e2){e.textContent=(e2.code==='auth/email-already-in-use'?t('bad'):authMessage(e2));return}}
    else{e.textContent=authMessage(err);return}
  }
  await afterLogin(cred.user);
}
async function gLogin(){
  const e=$('#e');
  try{
    const r=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());const user=r.user,ref=fsdb.collection('users').doc(user.uid);
    if(!(await ref.get()).exists)await ref.set({uid:user.uid,email:user.email||'',fn:user.displayName||'',gm:(user.email||'').toLowerCase(),role:'s',ok:[],ban:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    await afterLogin(user);
  }catch(err){if(e)e.textContent=authMessage(err);console.error(err)}
}
async function doSignup(){
  const ids=['fn','sn','fam','gr','fp','mp','ph','gm','u','p'],v={};ids.forEach(i=>v[i]=$('#'+i).value.trim());const e=$('#e');e.textContent='';
  if(ids.some(i=>!v[i])||v.p.length<6||!/^\S+@\S+\.\S+$/.test(v.gm)){e.textContent=t('req');return}
  try{
    const cred=await auth.createUserWithEmailAndPassword(v.gm.toLowerCase(),v.p);
    await fsdb.collection('users').doc(cred.user.uid).set({uid:cred.user.uid,fn:v.fn,sn:v.sn,fam:v.fam,gr:v.gr,fp:v.fp,mp:v.mp,ph:v.ph,gm:v.gm.toLowerCase(),username:v.u,role:'s',ok:[],ban:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    await afterLogin(cred.user);
  }catch(err){e.textContent=authMessage(err);console.error(err)}
}
async function afterLogin(user){
  stop();
  if(user.email===TEACHER){S.user={id:user.uid,role:'t',email:user.email};S.view='home';startTeacher();R();return}
  let p={};try{const s=await fsdb.collection('users').doc(user.uid).get();p=s.exists?s.data():{}}catch(err){console.error(err)}
  if(p.ban&&p.ban>Date.now()){await auth.signOut();S.view='login';R();const e=$('#e');if(e)e.textContent=t('banned')+' '+new Date(p.ban).toLocaleString();return}
  S.user={...p,id:user.uid,email:user.email||'',role:'s',ok:p.ok||[]};S.view='home';startStudent();R();
}
function stop(){[lessonUnsub,examUnsub,selfUnsub].forEach(f=>f&&f());lessonUnsub=examUnsub=selfUnsub=null}
function startExams(){examUnsub=fsdb.collection('exams').onSnapshot(s=>{D.exams=s.docs.map(d=>({...d.data(),id:d.id}));rerender()},e=>console.error('exams',e))}
function startTeacher(){lessonUnsub=fsdb.collection('lessons').onSnapshot(s=>{D.lessons=s.docs.map(d=>({...d.data(),id:d.id}));rerender()},e=>console.error('lessons',e));startExams()}
function startStudent(){
  selfUnsub=fsdb.collection('users').doc(S.user.id).onSnapshot(async s=>{
    const d=s.data()||{};
    if(d.ban&&d.ban>Date.now()){await logout();return}
    S.user={...S.user,...d,role:'s',ok:d.ok||[]};
    const docs=await Promise.all(S.user.ok.map(id=>fsdb.collection('lessons').doc(id).get().catch(()=>null)));
    D.lessons=docs.filter(x=>x&&x.exists).map(x=>({...x.data(),id:x.id}));rerender();
  },e=>console.error('self',e));
  startExams();
}
function rerender(){if(S.user&&['home','lessons','exams','perf'].includes(S.view)&&!document.querySelector('.mod'))R()}
async function logout(){stop();try{await auth.signOut()}catch(e){console.error(e)}S.user=null;D.lessons=[];D.exams=[];S.view='intro';R()}
async function changePassword(){
  const msg=$('#pwerr'),old=$('#oldpw').value,next=$('#newpw').value,conf=$('#confpw').value,ar=S.lang==='ar';msg.className='err';msg.textContent='';
  if(!old||!next||!conf){msg.textContent=ar?'املأ كل الحقول.':'Fill in all fields.';return}
  if(next.length<6){msg.textContent=ar?'كلمة السر الجديدة 6 أحرف على الأقل.':'New password must be 6+ characters.';return}
  if(next!==conf){msg.textContent=ar?'تأكيد كلمة السر غير مطابق.':'Confirmation does not match.';return}
  const user=auth.currentUser;if(!user||!user.email){msg.textContent=ar?'سجّل الدخول مرة أخرى.':'Sign in again.';return}
  try{await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,old));await user.updatePassword(next);
    $('#oldpw').value=$('#newpw').value=$('#confpw').value='';msg.className='ok';msg.textContent=ar?'تم تغيير كلمة السر بنجاح ✓':'Password changed ✓'}
  catch(err){console.error(err);const c=err.code;msg.textContent=c==='auth/weak-password'?(ar?'كلمة السر ضعيفة.':'Password too weak.'):c==='auth/too-many-requests'?(ar?'محاولات كثيرة؛ حاول لاحقًا.':'Too many attempts.'):(ar?'تعذر التغيير. تأكد من كلمة السر الحالية.':'Could not change. Check current password.')}
}

/* ---------- lessons ---------- */
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const c=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=c}}return m[b.length]}
function doSearch(){const q=S.q.trim().toLowerCase(),r=$('#res');if(!q){r.innerHTML='';return}
const ls=D.lessons,hit=ls.filter(l=>String(l.title).toLowerCase().includes(q));let out=hit,note='';
if(!hit.length&&ls.length){const best=ls.map(l=>({l,d:Math.min(...String(l.title).toLowerCase().split(/\s+/).map(w=>lev(q,w)))})).sort((a,b)=>a.d-b.d)[0];out=[best.l];note=t('best')+': '}
r.innerHTML=out.map(l=>`<div class="row"><b>${note}📘 ${esc(l.title)}</b><button class="btn p" onclick="view('${esc(l.id)}')">▶ ${t('watch')}</button></div>`).join('')||`<p>${t('nf')}</p>`}
function modal(h){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div>${h}<p><button class="btn g" onclick="this.closest('.mod').remove();rerender()">${t('close')}</button></p></div>`;document.body.appendChild(m);return m}
function view(id){const l=D.lessons.find(x=>String(x.id)===String(id));if(!l)return;
  if(/^https?:\/\//i.test(l.url||''))window.open(l.url,'_blank','noopener,noreferrer')}
function addLesson(){const ar=S.lang==='ar';modal(`<h3>${t('addL')}</h3>${field('lt','title')}<label class="sm">${ar?'رابط الدرس (يوتيوب أو أي رابط)':'Lesson link (YouTube or any link)'}</label><input id="lu" type="url" dir="ltr" placeholder="https://youtu.be/..."><div class="err" id="lessonerr"></div><button class="btn" onclick="saveLesson(this)">${t('save')}</button>`)}
async function saveLesson(b){
  const ar=S.lang==='ar',ti=$('#lt').value.trim(),url=$('#lu').value.trim(),msg=$('#lessonerr');
  if(!ti){msg.textContent=ar?'اكتب عنوان الدرس.':'Enter a title.';return}
  if(!/^https?:\/\//i.test(url)){msg.textContent=ar?'الصق رابط الدرس (يبدأ بـ https://).':'Paste the link (starts with https://).';return}
  b.disabled=true;
  try{const id=String(Date.now());await fsdb.collection('lessons').doc(id).set({title:ti,url,createdAt:firebase.firestore.FieldValue.serverTimestamp()});b.closest('.mod').remove();R()}
  catch(err){console.error(err);msg.textContent=(ar?'فشل الحفظ: ':'Save failed: ')+(err.code||err.message);b.disabled=false}
}
async function delItem(k,id){if(!confirm(t('del')+'؟'))return;try{await fsdb.collection(k).doc(String(id)).delete()}catch(err){console.error(err);alert((S.lang==='ar'?'تعذر الحذف: ':'Could not delete: ')+(err.code||err.message))}}

/* ---------- exams ---------- */
function addExam(){modal(`<h3>${t('addE')}</h3>${field('et','title')}<label class="sm">${t('end')}</label><input id="ee" type="datetime-local">${field('ed','dur','number')}${field('en','tries','number')}<div class="err" id="examerr"></div><button class="btn" onclick="saveExam(this)">${t('save')}</button>`)}
async function saveExam(b){const x={title:$('#et').value.trim(),end:new Date($('#ee').value).getTime(),dur:+$('#ed').value,tries:+$('#en').value,createdAt:firebase.firestore.FieldValue.serverTimestamp()},msg=$('#examerr');
  if(!x.title||!x.end||!x.dur||!x.tries){msg.textContent=t('req');return}
  try{await fsdb.collection('exams').doc(String(Date.now())).set(x);b.closest('.mod').remove();R()}catch(e){console.error(e);msg.textContent=(e.code||e.message)}}
function takeExam(id){const e=D.exams.find(x=>String(x.id)===String(id));if(!e)return;if(isT()){modal(`<h3>${esc(e.title)}</h3>`);return}
  const k=S.user.id+':'+id,n=D.att[k]||0;if(Date.now()>e.end)return modal(`<p>${t('closed')}</p>`);if(n>=e.tries)return modal(`<p>${t('nomore')}</p>`);
  D.att[k]=n+1;saveAtt();modal(`<h3>${esc(e.title)}</h3><p>${t('started')} ${e.dur}</p><p class="sm">${n+1} / ${e.tries}</p>`)}

theme();R();
auth.onAuthStateChanged(user=>{if(user){if(!S.user)afterLogin(user)}else if(S.user){S.user=null;S.view='intro';R()}});
</script></body></html>
