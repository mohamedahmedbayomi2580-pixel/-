<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة ماناسا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfcfb;--fg:#19372d;--card:#fff;--red:#14513d;--pur:#7863a8;--bd:#e4ebe6;--yel:#f5c928;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0f;--fg:#f2f2f2;--card:#1a1a1e;--bd:#333}}
:root[data-theme=dark]{--bg:#0d0d0f;--fg:#f2f2f2;--card:#1a1a1e;--bd:#333}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;transition:.3s}
#app{min-height:100vh;display:flex;flex-direction:column}main{flex:1}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--red);color:#fff;font-weight:bold;transition:transform .18s,box-shadow .18s,background .18s}
.btn.y{background:var(--yel);color:#000}.btn.p{background:var(--pur)}.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}.btn:disabled{opacity:.5}.btn.s{padding:6px 12px;font-size:.85em}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);margin:5px 0}
.box{max-width:430px;margin:6vh auto;padding:24px;border-radius:16px;background:var(--card);border-top:4px solid var(--red);border-bottom:4px solid var(--pur)}
.box h2{margin-top:0}.sm{font-size:.82em}.err{color:#e33;font-size:.85em;min-height:1em}.ok{color:#1a8a3a;font-size:.9em}
a.l{color:var(--pur);cursor:pointer;text-decoration:underline}
.tools{position:fixed;top:14px;left:14px;display:flex;gap:8px;align-items:center;z-index:5}
.tool{width:46px;height:60px;animation:fly 2.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes fly{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(5) rotate(var(--r))}40%{opacity:1}100%{opacity:1;transform:none}}
.ent{display:flex;gap:8px;margin-inline-start:10px;animation:fade 1s 2.6s both}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.hero0{min-height:80vh;display:grid;place-items:center;text-align:center}
.hero0 h1{font-size:clamp(2rem,6vw,3.6rem);margin:0;animation:fade 1.2s 1s both;color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--red);position:sticky;top:0;background:var(--bg);z-index:4}
.ham{background:none;border:0;cursor:pointer;display:grid;gap:5px;padding:6px}.ham i{display:block;width:28px;height:3px;background:var(--fg);border-radius:2px}
.bell{position:relative;background:none;border:0;font-size:1.5em;cursor:pointer;color:var(--fg)}
.bell b{position:absolute;top:-2px;right:-4px;background:var(--red);color:#fff;border-radius:50%;font-size:.45em;padding:2px 6px}
.drop{position:fixed;left:12px;top:62px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;width:min(320px,92vw);max-height:70vh;overflow:auto;z-index:6}
.menu{position:fixed;top:0;right:0;height:100%;width:min(300px,85vw);background:var(--card);border-inline-start:4px solid var(--pur);padding:70px 18px 18px;z-index:9;transform:translateX(100%);transition:.3s;overflow:auto}
.menu.o{transform:none}.menu a{display:block;padding:14px;border-radius:10px;cursor:pointer;font-weight:bold}.menu a:hover{background:var(--red);color:#fff}
.shade{position:fixed;inset:0;background:#0008;z-index:8}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.sbar{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 10px;max-width:340px}.sbar input{border:0;background:none;margin:0}
.banner{background:linear-gradient(120deg,var(--red),var(--pur));color:#fff;text-align:center;font-size:clamp(1.3rem,4vw,2.2rem);font-weight:900;padding:42px 14px;border-radius:18px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sq{aspect-ratio:1;background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--red);border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.sq:hover{border-bottom-color:var(--pur)}.sq small{opacity:.7}
.tile{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--pur);border-radius:14px;padding:14px;text-align:center;cursor:pointer}.tile h2{margin:6px 0;color:var(--red)}
.big{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--pur),var(--red));color:#fff;border-radius:16px;padding:16px;margin:14px 0;cursor:pointer}.big h2{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px}
.av{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--pur);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.3em;flex:none}
.mod{position:fixed;inset:0;background:#000a;z-index:20;display:grid;place-items:center;padding:14px}.mod>div{background:var(--bg);padding:20px;border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border-top:4px solid var(--red)}
.q{background:var(--card);border-radius:10px;padding:10px;margin:8px 0}.q label{display:flex;gap:8px;align-items:center;padding:4px 0}.q input[type=radio]{width:auto;margin:0}
.qb{background:var(--card);border-radius:10px;padding:10px;margin:8px 0;border-inline-start:4px solid var(--pur)}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:20px;padding:2px 10px;font-size:.8em}.badge.g{background:#1a8a3a}
.av.sm{width:38px;height:38px;font-size:1em}.avbtn{background:none;border:0;padding:0;cursor:pointer}
.grp{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px}.grp h3{margin:0}
.foot{text-align:center;padding:18px 12px;font-size:.9em;border-top:3px solid var(--pur);margin-top:30px;background:var(--card)}.foot a{color:var(--pur);font-weight:bold;text-decoration:none}

.lb{position:fixed;inset:0;background:#000d;z-index:40;display:flex;flex-direction:column}
.lbt{display:flex;gap:8px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap}
.lbb{flex:1;overflow:auto;display:flex}.lbb img{margin:auto;max-width:none;height:auto;cursor:zoom-in;border-radius:8px;transition:width .15s}
.note{position:relative;color:#222;padding:12px 14px 10px;margin:8px 4px 14px;border-radius:3px 3px 16px 3px;box-shadow:2px 4px 8px #0005;transform:rotate(-1.2deg);font-weight:600}
.note:nth-child(even){transform:rotate(1.2deg)}
.note .nh{font-size:.8em;opacity:.75}.note .nt{white-space:pre-wrap;word-break:break-word;margin:6px 0;font-size:1.02em}.note .nd{font-size:.7em;opacity:.6}
.note .nx{position:absolute;top:2px;left:4px;background:none;border:0;cursor:pointer;color:#222;font-size:.9em}
.nw{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:.8em}

.banner{position:relative}
.banner.bimg{padding:0;background:none;overflow:hidden;line-height:0}
.banner.bimg img{width:100%;height:auto;display:block;border-radius:18px}
.btxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;line-height:1.4;text-shadow:0 2px 8px #000a,0 0 2px #0008;font-weight:900;font-size:clamp(1.3rem,4vw,2.2rem);text-align:center;word-break:break-word}
.pen{border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer;font-size:1rem;line-height:1;z-index:7;box-shadow:0 2px 6px #0005;padding:0;width:34px;height:34px;border-radius:50%}
.pen.bn{position:absolute;top:8px;inset-inline-start:8px}
.pen.bgpen{position:fixed;bottom:16px;inset-inline-start:16px;width:auto;height:40px;padding:0 14px;border-radius:20px;font-weight:bold}
body.hb{background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat}
.hb .wrap>h3,.hb .wrap>h2,.hb .grp h3,.hb .wrap>p.sm{background:color-mix(in srgb,var(--bg) 82%,transparent);padding:2px 12px;border-radius:10px}
.hb .wrap>h3,.hb .wrap>h2{display:inline-block}
.pbar{height:14px;background:var(--bd);border-radius:10px;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--pur));transition:width .4s}
.pct{font-size:1.8em;font-weight:900;color:var(--red)}

/* ===== صفحة الدخول / إنشاء الحساب (شاشة منقسمة 40/60) ===== */
.auth{--g:#0f3d2e;--g2:#1b5e47;--sage:#eef5f0;--pur:#7a5fa8;--yel:#f5c518;--mut:#6b7f74;--ln:#dfe8e2;
  display:grid;grid-template-columns:40% 60%;min-height:100vh;direction:ltr;font-family:'Cairo','Tajawal',Tahoma,sans-serif;color:var(--g)}
.auth *{font-family:inherit}
.auth .a-info,.auth .a-form{padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:center}
.auth .a-info{background:var(--sage)}
.auth .a-form{background-color:#fff;background-image:linear-gradient(#0f3d2e0d 1px,transparent 1px),linear-gradient(90deg,#0f3d2e0d 1px,transparent 1px);background-size:34px 34px;align-items:center}
.auth .a-in{width:100%;max-width:520px}
.auth .logo{display:flex;align-items:center;gap:12px;margin-bottom:clamp(20px,4vh,40px)}
.auth .logo b{font-size:2.4rem;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--g2),var(--pur));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth .logo span{font-size:1.5rem;font-weight:800;color:var(--g)}
.auth h1{font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:900;margin:0 0 12px;line-height:1.4;color:var(--g)}
.auth .sub{color:var(--mut);font-size:1rem;line-height:1.9;margin:0 0 clamp(18px,3vh,30px)}
.auth .feat{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px #0f3d2e0a;transition:.25s}
.auth .feat:hover{transform:translateY(-2px);box-shadow:0 8px 20px #0f3d2e14}
.auth .feat h4{margin:0 0 2px;font-size:1rem;font-weight:800;color:var(--g)}
.auth .feat p{margin:0;font-size:.85rem;color:var(--mut);line-height:1.6}
.auth .ic{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.auth .ic svg{width:24px;height:24px}
.auth .ic.p{background:#7a5fa81f;color:var(--pur)}.auth .ic.g{background:#0f3d2e1a;color:var(--g)}.auth .ic.y{background:#f5c51833;color:#c99a00}
.auth .tabs{display:flex;gap:10px;margin-bottom:28px}
.auth .tab{flex:1;border:0;border-radius:999px;padding:12px 10px;font-size:1rem;font-weight:800;cursor:pointer;background:#eceff1;color:#111;transition:.25s}
.auth .tab.on{background:var(--g);color:#fff;box-shadow:0 6px 16px #0f3d2e40}
.auth .tab:not(.on):hover{background:#e0e5e2}
.auth .ft{text-align:center;margin-bottom:26px}
.auth .ft h2{margin:0 0 6px;font-size:1.8rem;font-weight:900;color:var(--g)}
.auth .ft p{margin:0;color:var(--mut)}
.auth label.lb2{display:block;font-weight:700;font-size:.95rem;margin:16px 0 7px;color:var(--g)}
.auth .inp{position:relative}
.auth .inp input{width:100%;margin:0;background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:13px 16px;padding-inline-end:46px;font-size:1rem;color:#111;outline:0;transition:.2s}
.auth .inp input::placeholder{color:#a3b0a9}
.auth .inp input:focus{border-color:var(--g);box-shadow:0 0 0 4px #0f3d2e1a}
.auth .inp .si{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#8a9b92;pointer-events:none}
.auth .inp:focus-within .si{color:var(--pur)}
.auth .inp.pw input{padding-inline-end:76px}
.auth .inp.pw .si{inset-inline-end:44px}
.auth .eye{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;padding:4px;color:#8a9b92;display:grid}
.auth .eye svg{width:20px;height:20px}.auth .eye:hover{color:var(--g)}
.auth .two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.auth .forgot{margin:10px 0 0;font-size:.85rem}
.auth .forgot a{color:var(--pur);cursor:pointer;text-decoration:none;font-weight:600}.auth .forgot a:hover{text-decoration:underline}
.auth .err{color:#d93025;font-size:.9rem;min-height:1.3em;margin:12px 0 0;text-align:center}
.auth .ok{color:#1a8a3a}
.auth .go{position:relative;width:100%;margin-top:14px;border:0;border-radius:999px;padding:15px;font-size:1.1rem;font-weight:900;cursor:pointer;background:var(--g);color:#fff;overflow:hidden;box-shadow:0 10px 24px #0f3d2e40;transition:.25s}
.auth .go::after{content:"";position:absolute;bottom:0;left:18%;right:18%;height:3px;border-radius:3px;background:var(--yel)}
.auth .go:hover{background:var(--g2);transform:translateY(-1px)}
.auth .go:active{transform:none}
.auth .go:disabled{opacity:.6}
.auth .bk{display:block;text-align:center;margin-top:20px;font-size:.88rem;color:var(--mut);cursor:pointer}.auth .bk:hover{color:var(--g)}
@media(max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth .a-form{order:1;min-height:auto;padding-block:32px}
  .auth .a-info{order:2;padding-block:32px}
}
@media(max-width:520px){.auth .two{grid-template-columns:1fr}.auth .ft h2{font-size:1.5rem}}

/* ===== Manasa dashboard visual refresh ===== */
:root{--bg:#f7faf8;--fg:#18392e;--card:#fff;--red:#14513d;--pur:#7863a8;--bd:#e4ebe6;--yel:#f5c928}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:#f7faf8;color:#18392e}
button{transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.btn{background:#14513d;border-radius:12px;box-shadow:0 3px 10px #14513d12}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #14513d20}
.btn.y{background:#f5c928;color:#18392e}.btn.p{background:#7863a8}.btn.g{background:#fff;color:#18392e;border-color:#e4ebe6}
input,select,textarea{background:#fff;border:1px solid #e4ebe6;border-radius:13px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#14513d;box-shadow:0 0 0 3px #14513d15}
.top{padding:13px clamp(16px,3vw,32px);border-bottom:1px solid #e4ebe6;border-top:3px solid #14513d;box-shadow:0 4px 18px #18392e06;background:#fff}
.brandN{color:#14513d!important;font-size:1.12rem;letter-spacing:-.3px}
.ham i{background:#14513d}
.bell b{background:#f5c928;color:#18392e}
.wrap{max-width:1240px;padding:clamp(16px,2.5vw,30px)}
.menu{background:#fff;border-inline-start:1px solid #e4ebe6;box-shadow:-10px 0 30px #18392e0c}
.menu a{margin:4px 0;color:#315447;transition:.2s}
.menu a:hover{background:#eaf4ee;color:#14513d}
.sbar{max-width:none;width:100%;border-radius:999px;padding:3px 16px;background:#fff;border-color:#e4ebe6;box-shadow:0 3px 12px #18392e05}
.sbar:focus-within{border-color:#14513d;box-shadow:0 0 0 3px #14513d12}
.sbar input{padding:12px 4px;background:transparent}
.grid{gap:16px}
.tile{background:#fff;border:1px solid #e8eee9;border-top:0;border-radius:18px;padding:20px 16px;box-shadow:0 5px 20px #18392e08;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 26px #18392e10}
.tile h2{color:#14513d;font-size:1.8rem}
.tile:nth-child(2) h2{color:#7863a8}.tile:nth-child(4) h2{color:#b28b00}
.sq{aspect-ratio:auto;min-height:150px;background:#fff;border:1px solid #e7eee9;border-bottom:3px solid #14513d;border-radius:16px;padding:18px;box-shadow:0 4px 16px #18392e06;gap:12px;transition:transform .2s,box-shadow .2s}
.sq:hover{transform:translateY(-3px);border-bottom-color:#7863a8;box-shadow:0 10px 22px #18392e10}
.row{background:#fff;border-color:#e7eee9;border-radius:15px;padding:14px 16px;box-shadow:0 3px 14px #18392e05}
.big{background:linear-gradient(115deg,#14513d,#7863a8);border-radius:18px;box-shadow:0 8px 24px #14513d15}
.banner{margin:22px 0;border-radius:20px;box-shadow:0 8px 26px #18392e12}
.banner:not(.bimg){background:radial-gradient(ellipse at 15% 15%,#f5c928 0,transparent 32%),linear-gradient(120deg,#14513d 5%,#7863a8 70%,#f5c928 140%);padding:clamp(32px,5vw,58px) 20px}
.banner.bimg img{border-radius:20px;max-height:360px;object-fit:cover}
.pen{border:1px solid #e5ece7;background:#fff;color:#14513d;box-shadow:0 4px 14px #18392e20}
.pen:hover{background:#eaf4ee;transform:translateY(-1px)}
.pen.bgpen{bottom:18px;inset-inline-start:18px;background:#14513d;color:#fff;border:0;box-shadow:0 8px 24px #14513d30}
.grp{margin-top:26px;margin-bottom:10px}.grp h3{color:#14513d}
.foot{padding:11px 14px;margin-top:32px;background:#f0f4f1;border-top:2px solid #7863a8;color:#476255;font-size:.84rem}
.foot a{color:#14513d}
.badge{background:#7863a8}.badge.g{background:#e5f3e9;color:#14513d}
.mod>div{border-top-color:#14513d;box-shadow:0 20px 60px #0002}
.pbar i{background:linear-gradient(90deg,#14513d,#7863a8,#f5c928)}
.pct{color:#14513d}
.auth{--g:#14513d;--g2:#1c674d;--sage:#f0f6f2;--pur:#7863a8;--yel:#f5c928;--mut:#667b70;--ln:#e1eae4}
.auth .a-info{background:linear-gradient(145deg,#f0f6f2,#f7f5fb);position:relative;overflow:hidden}
.auth .a-info:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#f5c92824;left:-100px;bottom:-100px;pointer-events:none}
.auth .a-form{background-color:#fff;background-image:radial-gradient(#14513d10 1px,transparent 1px);background-size:22px 22px}
.auth .logo b{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#14513d,#7863a8);color:#fff;-webkit-text-fill-color:#fff;font-size:2rem;box-shadow:0 8px 18px #14513d22}
.auth .logo span{font-size:1.35rem}
.auth .feat{border-radius:16px}
.auth .go{background:#14513d}
@media(max-width:700px){
 .top{padding:11px 13px}.brandN{font-size:1rem}
 .wrap{padding:14px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .tile{padding:16px 10px}.tile h2{font-size:1.55rem}
 .sq{min-height:125px;padding:13px}
 .banner.bimg img{min-height:150px;object-fit:cover}
 .btxt{font-size:clamp(1rem,4.2vw,1.5rem)}
 .pen.bgpen{bottom:12px;inset-inline-start:12px;font-size:.82rem}
 .foot{padding:10px 8px;line-height:1.9}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}.auth .logo span{font-size:1.1rem}}

/* ================= Manasa Neumorphism v2 ================= */
:root{--nbg:#e4e7ec;--ncard:#fdfbf4;--nbd:#c4cad6;--nblue:#1f4fc4;--ntext:#2a3f78;--ngreen:#a9e8a0;--npur:#7c5cf0;--nyel:#ffd95a;--nlb:#cfe2ff;--nin-bg:#eceef3;--ndot:#aab1bf;
 --nsh:7px 7px 16px #b7bdc9,-7px -7px 16px #ffffff;--nsh2:4px 4px 9px #b7bdc9,-4px -4px 9px #ffffff;--nin:inset 3px 3px 7px #c1c7d2,inset -3px -3px 7px #ffffff;
 --bg:var(--nbg);--fg:var(--ntext);--card:var(--ncard);--bd:var(--nbd);--red:#1f4fc4;--pur:#7c5cf0;--yel:#ffd95a}

/* ---------- students (teacher) ---------- */
function perfProgress(){
 const tid=S.pt||'',inT=x=>!tid||x.teacherId===tid,f=S.pf||'all';
 const ls=D.lessons.filter(inT),ex=D.exams.filter(e=>(!e.grade||e.grade===myGrade(e.teacherId))&&inT(e));
 const wl=ls.filter(l=>vc(l.id)>0),de=ex.filter(e=>D.subs.some(s=>s.examId===e.id));
 const iL=f!=='exams',iE=f!=='lessons',tot=(iL?ls.length:0)+(iE?ex.length:0),done=(iL?wl.length:0)+(iE?de.length:0);
 const pc=(a,b)=>b?Math.round(a/b*100):0,bar=(a,b)=>`<div class="pbar"><i style="width:${pc(a,b)}%"></i></div>`;
 const chip=(k,l)=>`<button class="btn ${f===k?'':'g'} s" onclick="S.pf='${k}';R()">${l}</button>`;
 const tsel=(S.user.teachers||[]).length>1?`<select style="width:auto;margin:0" onchange="S.pt=this.value;R()"><option value="">${t('allT')}</option>${D.teachers.filter(x=>(S.user.teachers||[]).includes(x.id)).map(x=>`<option value="${esc(x.id)}" ${tid===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:'';
 const li=(ok,title,extra)=>`<div class="row"><span>${ok?'✅':'⬜'} ${esc(title)}${extra||''}</span><span class="${ok?'ok':'sm'}">${ok?t('pDoneW'):t('pNotYet')}</span></div>`;
 return `<h3>📊 ${t('progress')}</h3><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${chip('all',t('pAll'))}${chip('lessons','📖 '+t('pLessons'))}${chip('exams','📄 '+t('pExams'))}${tsel}</div>
 <div class="row" style="display:block;margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="pct">${pc(done,tot)}%</span><span class="sm">${t('pDone')} ${done} ${t('pOf')} ${tot} ${t('pOpen')}</span></div>${bar(done,tot)}
 ${f==='all'?`<div class="sm" style="margin-top:6px">📖 ${t('pLessons')}: ${wl.length}/${ls.length} (${pc(wl.length,ls.length)}%) · 📄 ${t('pExams')}: ${de.length}/${ex.length} (${pc(de.length,ex.length)}%)</div>`:''}</div>
 ${iL?`<h4>📖 ${t('pLessons')} — ${wl.length}/${ls.length} (${pc(wl.length,ls.length)}%)</h4>${bar(wl.length,ls.length)}${[...ls].sort(byNew).map(l=>li(vc(l.id)>0,l.title,(+l.maxViews?` <span class="sm">👁 ${vc(l.id)}/${l.maxViews}</span>`:''))).join('')||`<p class="sm">—</p>`}`:''}
 ${iE?`<h4>📄 ${t('pExams')} — ${de.length}/${ex.length} (${pc(de.length,ex.length)}%)</h4>${bar(de.length,ex.length)}${[...ex].sort(byNew).map(e=>li(D.subs.some(s=>s.examId===e.id),e.title)).join('')||`<p class="sm">—</p>`}`:''}`}
function stList(q){const src=isAdmin()?D.all:D.students;
const f=src.filter(u=>[u.fn,u.sn,u.fam,u.gm,u.ph].join(' ').toLowerCase().includes((q||'').toLowerCase())&&(!S.ft||(u.teachers||[]).includes(S.ft)));
S.sel=S.sel||{};const vis=f.map(u=>u.id);S.vis=vis;const nsel=vis.filter(i=>S.sel[i]).length;
const tb=f.length?`<div class="row"><label class="who" style="cursor:pointer"><input type="checkbox" style="width:auto;margin:0" ${nsel===vis.length?'checked':''} onchange="selAll(this.checked)"><b>${t('selAll')} (${nsel}/${vis.length})</b></label><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn p s" ${nsel?'':'disabled'} onclick="msgStudents(selIds())">💌 ${t('msgSel')}</button><button class="btn s" ${nsel?'':'disabled'} onclick="delStudents(selIds())">🗑 ${t('delSel')}</button><button class="btn s" style="background:#444" onclick="delAll()">⚠️ ${t('delAll')}</button></div></div>`:'';
const rowH=u=>{const b=u.ban&&u.ban>Date.now();
const gn=D.groups.filter(g=>(g.allowed||[]).includes(u.id)).map(g=>'📁 '+esc(g.name));
const ln=D.lessons.filter(l=>(l.allowed||[]).includes(u.id)).map(l=>esc(l.title));
const tn=(u.teachers||[]).map(id=>{const x=D.teachers.find(z=>z.id===id);return x?esc(x.name):''}).filter(Boolean).join('، ');
return `<div class="row" style="align-items:flex-start"><div class="who" style="flex:1;min-width:230px;align-items:flex-start"><input type="checkbox" style="width:auto;margin:18px 0 0" ${S.sel[u.id]?'checked':''} onchange="selS('${esc(u.id)}',this.checked)">${av({photo:u.photo,name:u.fn})}<div><b>${esc(u.fn)} ${esc(u.sn)} ${esc(u.fam)}</b><div class="sm" style="line-height:1.9">✉️ ${esc(u.gm||u.email)}<br>📱 ${esc(u.ph)} · 👨 ${esc(u.fp)}<br>${t('joinedAt')}: ${esc(tstr(u.createdAt))}<br>🎓 ${gradeSel(u)}${tn?`<br>🧑‍🏫 ${tn}`:''}<br>${t('allowedN')}: ${[...gn,...ln].join('، ')||'—'}${b?`<br><span style="color:var(--red)">${t('banned')} ${new Date(u.ban).toLocaleString()}</span>`:''}</div></div></div><div style="display:grid;gap:6px"><button class="btn p s" onclick="allow('${esc(u.id)}')">＋ ${t('lessons')}</button><button class="btn s" onclick="ban('${esc(u.id)}')">${b?t('unban'):'⛔ '+t('ban')}</button><button class="btn g s" onclick="resetPw('${esc(u.id)}')">🔑 ${t('resetPw')}</button><button class="btn p s" onclick="msgStudents(['${esc(u.id)}'])">💌 ${t('msg')}</button><button class="btn s" onclick="delStudents(['${esc(u.id)}'])">🗑 ${t('del')}</button></div></div>`};
const gOf=u=>(u.grades||{})[gradeKey()]||'';
return tb+['1','2','3',''].map(g=>{const a=f.filter(u=>gOf(u)===g);return a.length?`<div class="grp"><h3>🎓 ${gname(g)} (${a.length})</h3></div>`+a.map(rowH).join(''):''}).join('')||`<p>${t('nf')}</p>`}

function allow(sid){const u=(isAdmin()?D.all:D.students).find(x=>x.id===sid);if(!u)return;
modal(`<h3>${t('allow')}</h3><div class="sm">${esc(u.fn)} ${esc(u.fam)}</div>${D.groups.length?`<h4>📁 ${t('grantG')}</h4>${[...D.groups].sort(byNew).map(g=>`<label class="row"><span>📁 ${esc(g.name)}</span><input type="checkbox" style="width:auto" ${(g.allowed||[]).includes(sid)?'checked':''} onchange="togG('${esc(sid)}','${esc(g.id)}',this)"></label>`).join('')}`:''}<h4>📘 ${t('grantL')}</h4>${[...D.lessons].sort(byNew).map(l=>`<label class="row"><span>${esc(l.title)}</span><input type="checkbox" style="width:auto" ${(l.allowed||[]).includes(sid)?'checked':''} onchange="tog('${esc(sid)}','${esc(l.id)}',this)"></label>`).join('')||`<p>${t('none')}</p>`}`)}
async function togG(sid,gid,box){try{await fsdb.collection('groups').doc(gid).update({allowed:box.checked?FV.arrayUnion(sid):FV.arrayRemove(sid)});const g=D.groups.find(x=>x.id===gid);g.allowed=(g.allowed||[]).filter(i=>i!==sid);if(box.checked)g.allowed.push(sid)}catch(e){console.error(e);box.checked=!box.checked;alert(t('errG')+' '+(e.code||''))}}

async function ban(uid){const u=(isAdmin()?D.all:D.students).find(x=>x.id===uid);const nb=(u.ban&&u.ban>Date.now())?0:Date.now()+864e5;
  try{await fsdb.collection('users').doc(uid).update({ban:nb});u.ban=nb;drawStudents()}catch(e){console.error(e);alert(t('errG')+' '+(e.code||''))}}
async function resetPw(uid){const u=(isAdmin()?D.all:D.students).find(x=>x.id===uid);const em=u&&(u.gm||u.email);if(!em)return;
  try{await auth.sendPasswordResetEmail(em);modal(`<p class="ok">${t('resetSent')}</p><p class="sm">${esc(em)}<br>${t('explain')}</p>`)}catch(e){console.error(e);alert(t('errG')+' '+(e.code||''))}}
async function acceptReq(rid){const r=D.reqs.find(x=>x.id===rid);if(!r)return;const me=S.user.id,g=r.grade||'';
  try{const up={teachers:FV.arrayUnion(me)};if(g)up['grades.'+me]=g;
    await fsdb.collection('users').doc(r.studentId).update(up);
    const ops=[];if(g)D.lessons.filter(l=>l.grade===g).forEach(l=>ops.push(b=>b.update(fsdb.collection('lessons').doc(l.id),{allowed:FV.arrayUnion(r.studentId)})));

function imgToData(file,max=200,lim=0){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);let q=.85,o=c.toDataURL('image/jpeg',q);while(lim&&o.length>lim&&q>.35){q-=.1;o=c.toDataURL('image/jpeg',q)}if(lim&&o.length>lim)return rej(new Error('big'));res(o)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- auth ---------- */
function authMessage(err){const c=err.code||'';
  if(['auth/user-not-found','auth/invalid-credential','auth/wrong-password'].includes(c))return t('bad');
  if(c==='auth/invalid-email')return S.lang==='ar'?'البريد الإلكتروني غير صحيح':'Invalid email address';
  if(c==='auth/email-already-in-use')return S.lang==='ar'?'البريد الإلكتروني مسجل بالفعل':'Email already registered';
  if(c==='auth/too-many-requests')return S.lang==='ar'?'محاولات كثيرة؛ حاول لاحقًا':'Too many attempts; try later';
  if(c==='auth/operation-not-allowed')return S.lang==='ar'?'فعّل Email/Password من Firebase ← Authentication':'Enable Email/Password in Firebase Authentication';
  if(c==='auth/unauthorized-domain')return S.lang==='ar'?'ضيف دومين الموقع في Authentication ← Settings ← Authorized domains':'Add this domain in Authorized domains';
  if(c==='auth/network-request-failed')return S.lang==='ar'?'تحقق من الإنترنت':'Check your connection';
  return (S.lang==='ar'?'حدث خطأ: ':'Error: ')+(c||err.message);}
async function doLogin(){
  const e=$('#e');e.textContent='';const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;
  const email=u==='1112'?TEACHER:u;if(!email||p.length<6){e.textContent=t('bad');return}
  let cred;
  try{cred=await auth.signInWithEmailAndPassword(email,p)}
  catch(err){
    if(email===TEACHER){try{cred=await auth.createUserWithEmailAndPassword(TEACHER,p)}catch(e2){e.textContent=(e2.code==='auth/email-already-in-use'?t('bad'):authMessage(e2));return}}
    else{e.textContent=authMessage(err);return}
  }
  await afterLogin(cred.user);
}
async function doSignup(){
  const ids=['fn','sn','fam','fp','ph','gm','p'],v={};ids.forEach(i=>v[i]=$('#'+i).value.trim());const e=$('#e');e.textContent='';
  if(ids.some(i=>!v[i])||v.p.length<6||!/^\S+@\S+\.\S+$/.test(v.gm)){e.textContent=t('req');return}
  const em0=v.gm.toLowerCase();SIGNING=true;
  try{
    let cred;
    try{cred=await auth.createUserWithEmailAndPassword(em0,v.p)}
    catch(err0){
      if(err0.code!=='auth/email-already-in-use')throw err0;
      /* الإيميل له حساب قديم في Authentication (مثلاً طالب اتحذف): نجرّب ندخل بنفس كلمة السر ونعيد إنشاء بياناته */
      try{cred=await auth.signInWithEmailAndPassword(em0,v.p)}
      catch(err1){e.innerHTML=(S.lang==='ar'?'الإيميل له حساب قديم. اكتب كلمة سره القديمة، أو ':'This email has an old account. Enter its old password, or ')+`<a class="l" onclick="resetOld('${esc(em0)}')">${S.lang==='ar'?'اضغط هنا لإرسال رابط تغيير كلمة السر':'send a password reset link'}</a>`;return}
      const ex=await fsdb.collection('users').doc(cred.user.uid).get();
      if(ex.exists){await auth.signOut();e.textContent=authMessage(err0);return}
    }
    await fsdb.collection('users').doc(cred.user.uid).set({uid:cred.user.uid,fn:v.fn,sn:v.sn,fam:v.fam,fp:v.fp,ph:v.ph,gm:v.gm.toLowerCase(),email:v.gm.toLowerCase(),photo:'',role:'s',teachers:[],ban:0,createdAt:FV.serverTimestamp()});
    await afterLogin(cred.user);
  }catch(err){e.textContent=authMessage(err);console.error(err)}
  finally{SIGNING=false}
}

async function afterLogin(user){
  stop();
  if(user.email===TEACHER){
    S.user={id:user.uid,role:'t',admin:true,email:user.email,name:t('mainT')};
    try{const tr=fsdb.collection('teachers').doc(user.uid),s=await tr.get();if(!s.exists)await tr.set({uid:user.uid,name:t('mainT'),photo:'',createdAt:FV.serverTimestamp()});else S.user.name=s.data().name}catch(e){console.error(e)}
    S.view='home';startTeacher();R();return}
  let p=null;try{const s=await fsdb.collection('users').doc(user.uid).get();p=s.exists?s.data():null}catch(err){console.error(err)}
  if(!p){await auth.signOut();S.view='login';R();const e=$('#e');if(e)e.textContent=t('bad');return}
  if(p.ban&&p.ban>Date.now()){await auth.signOut();S.view='login';R();const e=$('#e');if(e)e.textContent=t('banned')+' '+new Date(p.ban).toLocaleString();return}
  if(p.role==='t'){try{const td=await fsdb.collection('teachers').doc(user.uid).get();if(td.exists&&td.data().off){await auth.signOut();S.view='login';R();const e=$('#e');if(e)e.textContent=t('tOffMsg');return}}catch(err){console.error(err)}S.user={...p,id:user.uid,role:'t',admin:false};S.view='home';startTeacher();R();return}
  S.user={...p,id:user.uid,email:user.email||'',role:'s',teachers:p.teachers||[]};S.view='home';startStudent();R();
}

  on(c('lessons').where('allowed','array-contains',me),s=>{D.lessonsA=s.docs.map(mk);mergeL()});
  on(c('groups').where('allowed','array-contains',me),s=>{D.groups=s.docs.map(mk);watchGroups()});
  on(c('requests').where('studentId','==',me),s=>{D.myReqs=s.docs.map(mk);rerender()});
  on(c('submissions').where('studentId','==',me),s=>{D.subs=s.docs.map(mk);rerender()});
  on(c('messages').where('studentId','==',me),s=>{D.msgs=s.docs.map(mk).sort((a,b)=>tsec(b.createdAt)-tsec(a.createdAt));rerender()});

function watchGroups(){const key=D.groups.map(g=>g.id).sort().join(',');if(key===gKey){mergeL();return}gKey=key;gUnsubs.forEach(f=>f());gUnsubs=[];D.lessonsG={};
  D.groups.forEach(g=>gUnsubs.push(fsdb.collection('lessons').where('groupId','==',g.id).onSnapshot(s=>{D.lessonsG[g.id]=s.docs.map(mk);mergeL()},e=>console.error('gl',e))));mergeL()}

async function changePassword(){
  const msg=$('#pwerr'),old=$('#oldpw').value,next=$('#newpw').value,conf=$('#confpw').value,ar=S.lang==='ar';msg.className='err';msg.textContent='';
  if(!old||!next||!conf){msg.textContent=ar?'املأ كل الحقول.':'Fill in all fields.';return}
  if(next.length<6){msg.textContent=ar?'كلمة السر الجديدة 6 أحرف على الأقل.':'New password must be 6+ characters.';return}
  if(next!==conf){msg.textContent=ar?'تأكيد كلمة السر غير مطابق.':'Confirmation does not match.';return}
  const user=auth.currentUser;if(!user||!user.email){msg.textContent=ar?'سجّل الدخول مرة أخرى.':'Sign in again.';return}
  try{await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,old));await user.updatePassword(next);
    $('#oldpw').value=$('#newpw').value=$('#confpw').value='';msg.className='ok';msg.textContent=ar?'تم تغيير كلمة السر بنجاح ✓':'Password changed ✓'}
  catch(err){console.error(err);const c=err.code;msg.textContent=c==='auth/weak-password'?(ar?'كلمة السر ضعيفة.':'Password too weak.'):c==='auth/too-many-requests'?(ar?'محاولات كثيرة؛ حاول لاحقًا.':'Too many attempts.'):(ar?'تعذر التغيير. تأكد من كلمة السر الحالية.':'Could not change. Check current password.')}
}

function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const c=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=c}}return m[b.length]}
function doSearch(){const q=S.q.trim().toLowerCase(),r=$('#res');if(!q){r.innerHTML='';return}
const ls=D.lessons,hit=ls.filter(l=>String(l.title).toLowerCase().includes(q));let out=hit,note='';
if(!hit.length&&ls.length){const best=ls.map(l=>({l,d:Math.min(...String(l.title).toLowerCase().split(/\s+/).map(w=>lev(q,w)))})).sort((a,b)=>a.d-b.d)[0];out=[best.l];note=t('best')+': '}
r.innerHTML=out.map(l=>`<div class="row"><b>${note}📘 ${esc(l.title)} ${vInfo(l)}</b>${lessonOut(l)?`<button class="btn g" disabled>🚫</button>`:`<button class="btn p" onclick="view('${esc(l.id)}')">▶ ${t('watch')}</button>`}</div>`).join('')||`<p>${t('nf')}</p>`}
function modal(h){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div>${h}<p><button class="btn g" onclick="this.closest('.mod').remove();rerender()">${t('close')}</button></p></div>`;document.body.appendChild(m);return m}
function view(id){const l=D.lessons.find(x=>String(x.id)===String(id));if(!l)return;if(!/^https?:\/\//i.test(l.url||''))return;
  if(isT()){window.open(l.url,'_blank','noopener,noreferrer');return}
  const n=vc(l.id),m=+l.maxViews||0;if(m&&n>=m){alert(t('noViews'));return}
  window.open(l.url,'_blank','noopener,noreferrer');countView(l,n)}

/* ---- إدارة المدرسين: نشاط + إيقاف/تفعيل ---- */
function tAct(x){const A=D.adm;let h=x.off?`<span class="badge off">⛔ ${t('suspended')}</span>`:'';if(!A.loaded)return h;
 const ls=A.lessons.filter(l=>l.teacherId===x.id),ex=A.exams.filter(e=>e.teacherId===x.id),sb=A.subs.filter(s=>s.teacherId===x.id);
 const ts=[...ls.map(l=>+l.id),...ex.map(e=>+e.id),...sb.map(s=>tsec(s.at)*1000)].filter(n=>n>1e12);const last=ts.length?Math.max(...ts):0;
 return h+`<div class="sm">📖 ${ls.length} · 📄 ${ex.length} · 📝 ${sb.length} (${sb.filter(s=>s.grade==null).length} ${t('ungraded')}) · ${t('lastAct')}: ${last?new Date(last).toLocaleDateString():'—'}</div>`}
async function togTeacher(tid){const x=D.teachers.find(z=>z.id===tid);if(!x||tid===S.user.id)return;const off=!x.off;if(off&&!confirm(t('confirmSusp')))return;
 try{await fsdb.collection('teachers').doc(tid).update({off})}catch(e){console.error(e);alert(t('errG')+' '+(e.code||''))}}

/* ---- لوحة الصفحة الرئيسية (2x2) ---- */
const upExams=()=>[...D.exams].filter(e=>e.end>Date.now()&&(!e.grade||e.grade===myGrade(e.teacherId))).map(e=>({e,used:D.subs.filter(s=>s.examId===e.id).length})).filter(x=>x.used<(+x.e.tries||1)).sort((a,b)=>a.e.end-b.e.end);
function left(ms){const d=ms-Date.now();if(d<=0)return t('ended');const m=Math.floor(d/6e4),h=Math.floor(m/60),dd=Math.floor(h/24);return dd>0?`${dd} ${t('dayU')} ${h%24} ${t('hourU')}`:h>0?`${h} ${t('hourU')} ${m%60} ${t('minU')}`:`${m} ${t('minU')}`}
function stuProg(){const ls=D.lessons,ex=D.exams.filter(e=>!e.grade||e.grade===myGrade(e.teacherId));const done=ls.filter(l=>vc(l.id)>0).length+ex.filter(e=>D.subs.some(s=>s.examId===e.id)).length,tot=ls.length+ex.length;return{done,tot,pc:tot?Math.round(done/tot*100):0}}
function homeNM(ls){const adm=isAdmin(),A=D.adm,ready=adm&&A.loaded&&!A.err,b=S.banner||{};
 const L_=ready?[...A.lessons].sort(byNew):ls,E_=ready?A.exams:D.exams;
 let h='';const an=S.ann;
 if(an&&an.text&&(adm||LS.g('annSeen','')!==(an.id||'')))h+=annBar(an,adm);
 if(!adm){const soon=upExams().filter(x=>x.e.end-Date.now()<172800000);
  if(soon.length)h+=`<div class="annb warn"><span>⏰</span><div style="flex:1"><b>${t('examSoon')}</b>${soon.slice(0,3).map(x=>`<div>${esc(x.e.title)} — ${left(x.e.end)}</div>`).join('')}</div><button class="btn s" onclick="go('exams')">${t('exams')}</button></div>`}
 h+=bannerH();
 /* TL */
 let tl;
 if(adm){const stu=D.allLoaded?D.all.length:'…';
  tl=`<div class="nmc"><div class="lrow"><h3>📊 ${t('overview')}</h3><button class="btn g s" onclick="loadAdm(true);loadAllStudents()">⟳</button></div><div class="stat4"><div><b>${stu}</b><span>${t('students')}</span></div><div><b>${D.teachers.length}</b><span>${t('teachers')}</span></div><div><b>${ready?L_.length:'…'}</b><span>${t('lessons')}</span></div><div><b>${ready?E_.length:'…'}</b><span>${t('exams')}</span></div></div><div class="avs">${D.teachers.slice(0,6).map(x=>av(x)).join('')}</div><button class="btn wide" style="margin-top:auto" onclick="annModal()">📢 ${t('announce')}</button></div>`}
 else{const ot=D.teachers.filter(x=>x.id!==S.user.id),jn=(S.user.teachers||[]).length;
  tl=`<div class="nmc"><h3>🧑‍🏫 ${t('availT')} (${ot.length})</h3><div class="avs">${ot.slice(0,6).map(x=>av(x)).join('')||`<p class="sm">${t('noT')}</p>`}</div><p class="sm">${t('mT')}: <b>${jn}</b>${jn?'':' — '+t('noJoin')}</p><button class="btn wide" style="margin-top:auto" onclick="go('teachers')">${t('teachers')}</button></div>`}
 /* TR */
 const l3=L_.slice(0,3),cls=['a','b','c'],open=l=>D.lessons.some(x=>x.id===l.id)?`view('${esc(l.id)}')`:`go('lessons')`;
 const tr=`<div class="nmc"><h3>📘 ${t('latest')}</h3><div class="lc3">${[0,1,2].map(i=>{const l=l3[i];const st=(i===2&&b.img)?` style="background-image:url('${esc(b.img)}')"`:'';return l?`<div class="lc ${cls[i]}"${st} onclick="${open(l)}">${esc(l.title)}</div>`:`<div class="lc ${cls[i]}" style="opacity:.45"${st}>—</div>`}).join('')}</div><div class="sm">${l3.map(l=>'📘 '+esc(l.title)).join('<br>')||t('none')}</div><div class="sm" style="margin-top:auto">${t('lessons')}: <b>${L_.length}</b> · ${t('exams')}: <b>${E_.length}</b></div></div>`;
 /* BL */
 let bl;
 if(adm)bl=`<div class="nmc"><h3>📨 ${t('reqs')} (${D.reqs.length})</h3>${D.reqs.slice(0,6).map(r=>`<div class="lrow"><b>${esc(r.name)} <span class="sm">· ${gname(r.grade||'')}</span></b><button class="plus" title="${t('accept')}" onclick="acceptReq('${esc(r.id)}')">＋</button></div>`).join('')||`<p class="sm">${t('noReq')}</p>`}</div>`;
 else{const up=upExams().slice(0,5);bl=`<div class="nmc"><h3>⏰ ${t('upcoming')}</h3>${up.map(x=>`<div class="lrow"><div><b>${esc(x.e.title)}</b><div class="sm">⏳ ${left(x.e.end)} · ${x.used}/${x.e.tries}</div></div><button class="plus" title="${t('start')}" onclick="startExam('${esc(x.e.id)}')">▶</button></div>`).join('')||`<p class="sm">${t('noUp')}</p>`}</div>`}
 /* BR */
 let br;
 if(adm){const sb=ready?A.subs:[],gd=sb.filter(s=>s.grade!=null).length,pc=sb.length?Math.round(gd/sb.length*100):0;
  br=`<div class="nmc"><h3>📊 ${t('reports')}</h3><div class="mini3">${mini('reports',t('reports'))}${mini('teachers',t('teachers'))}${mini('students',t('students'))}</div><div><div class="sm">${t('gradedP')}: ${gd}/${sb.length} (${pc}%)</div><div class="nbar"><i style="width:${pc}%"></i></div></div></div>`}
 else{const p=stuProg();br=`<div class="nmc"><h3>📈 ${t('myProg')}</h3><div class="mini3">${mini('lessons',t('lessons'))}${mini('exams',t('exams'))}${mini('perf',t('perf'))}</div><div><div class="sm">${t('pDone')} ${p.done} ${t('pOf')} ${p.tot} — <b>${p.pc}%</b></div><div class="nbar"><i style="width:${p.pc}%"></i></div></div></div>`}
 h+=`<div class="nmg">${tl}${tr}${bl}${br}</div>`;
 if(adm)h+=`<button class="pen bgpen" onclick="editBg()">✏️ ${t('bgEdit')}</button>`;
 h+=`<h3>${t('latest')}</h3><div class="grid">${ls.map(l=>`<div class="sq" onclick="view('${esc(l.id)}')"><span>📘</span><b>${esc(l.title)}</b><small>${watched(l.id)?'✓ '+t('watched'):'▶ '+t('watch')}</small></div>`).join('')||`<p>${t('none')}</p>`}</div>`;
 return h}

/* ---- تقدّمي (طالب): إحصائيات إضافية ---- */
function perfStats(){const g=D.subs.filter(s=>s.grade!=null&&!isNaN(parseFloat(s.grade))).map(s=>parseFloat(s.grade));
 const avg=g.length?(g.reduce((a,b)=>a+b,0)/g.length).toFixed(1):'—',best=g.length?Math.max(...g):'—',wl=D.lessons.filter(l=>vc(l.id)>0).length;
 return `<div class="grid" style="margin:14px 0"><div class="tile">👁<h2>${wl}/${D.lessons.length}</h2>${t('watchedL')}</div><div class="tile">🏆<h2>${avg}</h2>${t('avgG')}</div><div class="tile">⭐<h2>${best}</h2>${t('bestG')}</div><div class="tile">📝<h2>${D.subs.length}</h2>${t('subsN')}</div></div>`}

/* ---- التقارير والتصدير ---- */
function csvCell(c){let s=String(c==null?'':c);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function dlCsv(name,rows){const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
function repSrc(){const adm=isAdmin();return{subs:adm?D.adm.subs:D.subs,exs:adm?D.adm.exams:D.exams,us:adm?D.all:D.students}}
function repRows(){const r=repSrc();
 return r.subs.filter(s=>(!S.rt||s.teacherId===S.rt)&&(!S.re||s.examId===S.re)).map(s=>{const u=r.us.find(x=>x.id===s.studentId)||{},e=r.exs.find(x=>x.id===s.examId)||{},tc=D.teachers.find(x=>x.id===s.teacherId)||{};
  return{name:s.name||((u.fn||'')+' '+(u.fam||'')).trim(),ph:u.ph||'',yr:gname((u.grades||{})[s.teacherId]||''),tn:tc.name||'',ex:e.title||'',gr:s.grade==null?'':s.grade,cm:s.comment||'',at:s.at&&s.at.toDate?s.at.toDate():null}}).sort((a,b)=>(b.at||0)-(a.at||0))}
function reportsPage(){const adm=isAdmin();
 if(adm&&(!D.adm.loaded||!D.allLoaded))return `<h2>${t('reports')}</h2><p class="sm">${t('loadingD')}</p>`;
 const r=repSrc(),rows=repRows(),nums=rows.map(x=>parseFloat(x.gr)).filter(n=>!isNaN(n)),avg=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1):'—';
 const exOpts=r.exs.filter(e=>!S.rt||e.teacherId===S.rt).sort(byNew).map(e=>`<option value="${esc(e.id)}" ${S.re===e.id?'selected':''}>${esc(e.title)}</option>`).join('');
 return `<h2>📊 ${t('reports')}</h2><div class="stat4" style="max-width:420px;margin:10px 0"><div><b>${rows.length}</b><span>${t('rows')}</span></div><div><b>${avg}</b><span>${t('avgL')}</span></div></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0">${adm?`<select style="width:auto;margin:0" onchange="S.rt=this.value;S.re='';R()"><option value="">${t('allT')}</option>${D.teachers.map(x=>`<option value="${esc(x.id)}" ${S.rt===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}<select style="width:auto;margin:0" onchange="S.re=this.value;R()"><option value="">${t('allExams')}</option>${exOpts}</select>${adm?`<button class="btn g s" onclick="loadAdm(true);loadAllStudents()">⟳ ${t('refresh')}</button>`:''}</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportGrades()">⬇ ${t('exportRes')}</button><button class="btn p" onclick="exportStudents()">⬇ ${t('exportStu')}</button></div>
 <div class="twrap"><table class="tbl"><thead><tr><th>${t('colName')}</th><th>${t('colPhone')}</th><th>${t('colYear')}</th><th>${t('teacherL')}</th><th>${t('exams')}</th><th>${t('gradeL')}</th><th>${t('comment')}</th><th>${t('colDate')}</th></tr></thead><tbody>${rows.slice(0,200).map(x=>`<tr><td>${esc(x.name)}</td><td dir="ltr">${esc(x.ph)}</td><td>${esc(x.yr)}</td><td>${esc(x.tn)}</td><td>${esc(x.ex)}</td><td><b>${esc(x.gr)}</b></td><td>${esc(x.cm)}</td><td>${x.at?esc(x.at.toLocaleString()):''}</td></tr>`).join('')||`<tr><td colspan="8">${t('noData')}</td></tr>`}</tbody></table></div>`}
function exportGrades(){const rows=repRows();dlCsv('grades-'+new Date().toISOString().slice(0,10)+'.csv',[[t('colName'),t('colPhone'),t('colYear'),t('teacherL'),t('exams'),t('gradeL'),t('comment'),t('colDate')],...rows.map(x=>[x.name,x.ph,x.yr,x.tn,x.ex,x.gr,x.cm,x.at?x.at.toLocaleString():''])])}
function exportStudents(){const us=repSrc().us;dlCsv('students-'+new Date().toISOString().slice(0,10)+'.csv',[[t('colName'),t('colEmail'),t('colPhone'),t('fp'),t('mp'),t('colYear'),t('teachers'),t('colDate')],...us.filter(u=>!S.rt||(u.teachers||[]).includes(S.rt)).map(u=>[((u.fn||'')+' '+(u.sn||'')+' '+(u.fam||'')).trim(),u.gm||u.email||'',u.ph||'',u.fp||'',u.mp||'',gname((u.grades||{})[isAdmin()?(S.rt||''):S.user.id]||''),(u.teachers||[]).map(id=>(D.teachers.find(z=>z.id===id)||{}).name).filter(Boolean).join(' | '),tstr(u.createdAt)])])}

theme();R();applyBrand();
auth.onAuthStateChanged(user=>{if(user){if(!S.user&&!SIGNING)afterLogin(user)}else if(S.user){stop();S.user=null;S.view='intro';R()}});
</script></body></html>
