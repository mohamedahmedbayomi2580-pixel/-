<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة ماناسا</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f4f4f6;--red:#8b0000;--pur:#6b3fa0;--bd:#ddd;--yel:#ffd400;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0f;--fg:#f2f2f2;--card:#1a1a1e;--bd:#333}}
:root[data-theme=dark]{--bg:#0d0d0f;--fg:#f2f2f2;--card:#1a1a1e;--bd:#333}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;transition:.3s}
button,input,select{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--red);color:#fff;font-weight:bold}
.btn.y{background:var(--yel);color:#000}.btn.p{background:var(--pur)}.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);margin:5px 0}
.box{max-width:430px;margin:6vh auto;padding:24px;border-radius:16px;background:var(--card);border-top:4px solid var(--red);border-bottom:4px solid var(--pur)}
.box h2{margin-top:0}.sm{font-size:.82em}.err{color:#e33;font-size:.85em;min-height:1em}
a.l{color:var(--pur);cursor:pointer;text-decoration:underline}
/* intro */
.tools{position:fixed;top:14px;left:14px;display:flex;gap:8px;align-items:center;z-index:5}
.tool{width:46px;height:60px;animation:fly 2.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes fly{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(5) rotate(var(--r))}40%{opacity:1}100%{opacity:1;transform:none}}
.ent{display:flex;gap:8px;margin-inline-start:10px;animation:fade 1s 2.6s both}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.hero0{height:100vh;display:grid;place-items:center;text-align:center}
.hero0 h1{font-size:clamp(2rem,6vw,3.6rem);margin:0;animation:fade 1.2s 1s both}.hero0 h1 span{color:var(--red)}
/* app */
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px solid var(--red);position:sticky;top:0;background:var(--bg);z-index:4}
.ham{background:none;border:0;cursor:pointer;display:grid;gap:5px;padding:6px}.ham i{display:block;width:28px;height:3px;background:var(--fg);border-radius:2px}
.bell{position:relative;background:none;border:0;font-size:1.5em;cursor:pointer;color:var(--fg)}
.bell b{position:absolute;top:-2px;right:-4px;background:var(--red);color:#fff;border-radius:50%;font-size:.45em;padding:2px 6px}
.drop{position:absolute;left:12px;top:56px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;width:240px;z-index:6}
.menu{position:fixed;top:0;right:0;height:100%;width:min(300px,85vw);background:var(--card);border-inline-start:4px solid var(--pur);padding:70px 18px 18px;z-index:9;transform:translateX(100%);transition:.3s}
.menu.o{transform:none}.menu a{display:block;padding:14px;border-radius:10px;cursor:pointer;font-weight:bold}.menu a:hover{background:var(--red);color:#fff}
.shade{position:fixed;inset:0;background:#0008;z-index:8}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.sbar{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 10px;max-width:340px}.sbar input{border:0;background:none;margin:0}
.banner{background:linear-gradient(120deg,var(--red),var(--pur));color:#fff;text-align:center;font-size:clamp(1.3rem,4vw,2.2rem);font-weight:900;padding:42px 14px;border-radius:18px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sq{aspect-ratio:1;background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--red);border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.sq:hover{border-bottom-color:var(--pur)}.sq small{opacity:.7}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;flex-wrap:wrap}
.mod{position:fixed;inset:0;background:#000a;z-index:20;display:grid;place-items:center;padding:14px}.mod>div{background:var(--bg);padding:20px;border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;border-top:4px solid var(--red)}
video,iframe{width:100%;border-radius:10px;border:0}
</style></head><body><div id="app"></div>
<script>
const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v,(a,b)=>(a==='v'||a==='p')?undefined:b))}catch(e){}}};
const T={ar:{brand:'منصة ماناسا',hero:'تعليمك أساس',login:'تسجيل الدخول',signup:'إنشاء جديد',user:'اسم المستخدم',pass:'كلمة السر (6 أحرف على الأقل)',rem:'تذكرني',google:'الدخول بحساب جوجل',fn:'الاسم الأول',sn:'الاسم الثاني',fam:'اسم العائلة',grade:'السنة الدراسية',fp:'رقم الأب',mp:'رقم الأم',ph:'رقم الهاتف الشخصي',gm:'إيميل جوجل',back:'رجوع',home:'الرئيسية',lessons:'الدروس',exams:'الاختبارات',perf:'متابعة الأداء',set:'الإعدادات',out:'تسجيل خروج',students:'الطلاب',search:'ابحث عن الدرس',dream:'أنت قادر على تحقيق حلمك',latest:'أحدث الدروس',lang:'اللغة',theme:'الوضع',light:'فاتح',dark:'غامق',none:'لا يوجد شيء متاح لك حاليًا',del:'حذف',addL:'إضافة درس',addE:'إضافة اختبار',title:'العنوان',video:'فيديو',pdf:'ملف PDF',save:'حفظ',end:'وقت انتهاء الاختبار',dur:'مدة الاختبار (دقائق)',tries:'عدد مرات الفتح',open:'فتح',ban:'حظر يوم',unban:'فك الحظر',allow:'تحديد الدروس المسموحة',bad:'بيانات غير صحيحة',banned:'هذا الحساب محظور حتى',ggl:'لا يوجد حساب مسجل بهذا الإيميل. أنشئ حسابًا جديدًا أولًا',req:'املأ كل الخانات (كلمة السر 6 أحرف على الأقل)',taken:'اسم المستخدم مستخدم',closed:'انتهى وقت الاختبار',nomore:'استنفدت عدد المحاولات',started:'بدأ الاختبار، مدته (دقيقة):',tr:'محاولات',nf:'لا توجد نتائج',close:'إغلاق',best:'أقرب نتيجة'},
en:{brand:'Manasa Platform',hero:'Your Education Is the Foundation',login:'Log in',signup:'Sign up',user:'Username',pass:'Password (min 6 chars)',rem:'Remember me',google:'Sign in with Google',fn:'First name',sn:'Second name',fam:'Family name',grade:'School year',fp:"Father's phone",mp:"Mother's phone",ph:'Personal phone',gm:'Google email',back:'Back',home:'Home',lessons:'Lessons',exams:'Exams',perf:'Performance',set:'Settings',out:'Log out',students:'Students',search:'Search for a lesson',dream:'You can achieve your dream',latest:'Latest lessons',lang:'Language',theme:'Theme',light:'Light',dark:'Dark',none:'Nothing available for you yet',del:'Delete',addL:'Add lesson',addE:'Add exam',title:'Title',video:'Video',pdf:'PDF file',save:'Save',end:'Exam end time',dur:'Duration (minutes)',tries:'Allowed attempts',open:'Open',ban:'Ban 1 day',unban:'Unban',allow:'Choose allowed lessons',bad:'Invalid credentials',banned:'This account is banned until',ggl:'No account with this email. Sign up first',req:'Fill every field (password 6+ chars)',taken:'Username taken',closed:'Exam has ended',nomore:'No attempts left',started:'Exam started, minutes:',tr:'attempts',nf:'No results',close:'Close',best:'Closest match'}};
let D=LS.g('db',{users:[],lessons:[{id:1,title:'مقدمة في الكيمياء — Intro to Chemistry'},{id:2,title:'قوانين نيوتن — Newton Laws'}],exams:[],att:{}});
D.lessons.forEach(l=>{l.v=null;l.p=null});
let S={lang:LS.g('lang','ar'),theme:LS.g('theme','auto'),view:'intro',user:LS.g('sess',null),menu:false,bell:false,q:''};
const t=k=>T[S.lang][k]||k,$=s=>document.querySelector(s),save=()=>LS.s('db',D);
const isT=()=>S.user&&S.user.role==='t';
const me=()=>isT()?S.user:D.users.find(u=>u.id===S.user.id)||S.user;
const vis=()=>isT()?D.lessons:D.lessons.filter(l=>(me().ok||[]).includes(l.id));
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme);r.lang=S.lang;document.body.dir=S.lang==='ar'?'rtl':'ltr'}
function go(v){S.view=v;S.menu=false;S.bell=false;R()}
const svg={nb:'<svg viewBox="0 0 46 60"><rect x="4" y="2" width="38" height="56" rx="4" fill="#8b0000"/><rect x="10" y="2" width="32" height="56" rx="3" fill="#fff" stroke="#111"/><path d="M16 14h20M16 24h20M16 34h20" stroke="#6b3fa0" stroke-width="2"/></svg>',
rl:'<svg viewBox="0 0 46 60"><rect x="14" y="2" width="18" height="56" rx="2" fill="#ffd400" stroke="#111"/><path d="M14 10h8M14 18h12M14 26h8M14 34h12M14 42h8M14 50h12" stroke="#111"/></svg>',
bu:'<svg viewBox="0 0 46 60"><rect x="19" y="2" width="8" height="42" rx="2" fill="#fff" stroke="#111"/><rect x="19" y="20" width="8" height="24" fill="#6b3fa0"/><path d="M19 8h4M19 14h4M19 20h4M19 26h4" stroke="#111"/><path d="M21 44h4l-2 12z" fill="#8b0000"/><rect x="15" y="30" width="16" height="3" fill="#111"/></svg>',
pe:'<svg viewBox="0 0 46 60"><path d="M20 2h6v40l-3 14-3-14z" fill="#ffd400" stroke="#111"/><path d="M20 42h6l-3 14z" fill="#8b0000"/></svg>',
fl:'<svg viewBox="0 0 46 60"><path d="M18 4h10v18l12 30c1 4-1 6-4 6H10c-3 0-5-2-4-6l12-30z" fill="#fff" stroke="#111"/><path d="M12 44h22l4 10H8z" fill="#6b3fa0"/></svg>'};
const tools=()=>`<div class="tools">${[['nb','-60vw','40vh','-200deg',0],['rl','-50vw','30vh','160deg',.25],['bu','-40vw','45vh','-120deg',.5],['pe','-55vw','20vh','300deg',.75],['fl','-45vw','50vh','90deg',1]].map(a=>`<div class="tool" style="--dx:${a[1]};--dy:${a[2]};--r:${a[3]};--d:${a[4]}s">${svg[a[0]]}</div>`).join('')}<div class="ent"><button class="btn y" onclick="go('login')">${t('login')}</button><button class="btn y" onclick="go('signup')">${t('signup')}</button></div></div>`;
const bar=()=>`<div style="padding:10px;text-align:${S.lang==='ar'?'right':'left'}"><a class="l" onclick="go('intro')">← ${t('back')}</a></div>`;
function field(id,k,type='text'){return `<input id="${id}" type="${type}" placeholder="${t(k)}">`}
function R(){theme();const a=$('#app');let h='';
if(S.view==='intro')h=tools()+`<div class="hero0"><h1><span>${t('hero')}</span></h1></div>`;
else if(S.view==='login')h=bar()+`<div class="box"><h2>${t('login')}</h2>${field('u','user')}${field('p','pass','password')}<label class="sm"><input type="checkbox" id="rm" style="width:auto"> ${t('rem')}</label><div class="err" id="e"></div><button class="btn" style="width:100%" onclick="doLogin()">${t('login')}</button><p style="text-align:center"><button class="btn g" style="width:100%" onclick="gLogin()">G&nbsp; ${t('google')}</button></p></div>`;
else if(S.view==='signup')h=bar()+`<div class="box"><h2>${t('signup')}</h2>${field('fn','fn')}${field('sn','sn')}${field('fam','fam')}${field('gr','grade')}${field('fp','fp','tel')}${field('mp','mp','tel')}${field('ph','ph','tel')}${field('gm','gm','email')}${field('u','user')}${field('p','pass','password')}<div class="err" id="e"></div><button class="btn" style="width:100%" onclick="doSignup()">${t('signup')}</button></div>`;
else h=app();
a.innerHTML=h}
function app(){const v=S.view,ls=vis(),lat=[...ls].sort((x,y)=>y.id-x.id);
const items=[['home','🏠'],['lessons','📖'],['exams','📄'],['perf','📈'],...(isT()?[['students','👥']]:[]),['set','⚙️']];
let h=`<div class="top"><button class="ham" onclick="S.menu=true;R()"><i></i><i></i><i></i></button><span style="font-weight:900;color:var(--red)">${t('brand')}</span><button class="bell" onclick="S.bell=!S.bell;R()">🔔<b>${lat.length}</b></button></div>`;
if(S.bell)h+=`<div class="drop">${lat.slice(0,4).map(l=>`<div class="sm" style="padding:6px 0">📘 ${l.title}</div>`).join('')||`<div class="sm">${t('none')}</div>`}</div>`;
if(S.menu)h+=`<div class="shade" onclick="S.menu=false;R()"></div>`;
h+=`<div class="menu ${S.menu?'o':''}">${items.map(i=>`<a onclick="go('${i[0]}')">${i[1]} ${t(i[0])}</a>`).join('')}<a onclick="logout()">🚪 ${t('out')}</a></div><div class="wrap">`;
if(v==='home'){h+=`<div class="sbar">🔍<input id="q" value="${S.q}" placeholder="${t('search')}" oninput="S.q=this.value;doSearch()"></div><div id="res"></div><div class="banner">${t('dream')}</div><h3>${t('latest')}</h3><div class="grid">${lat.map(l=>`<div class="sq" onclick="view(${l.id})"><span>📘</span><b>${l.title}</b><small>#${l.id}</small></div>`).join('')||`<p>${t('none')}</p>`}</div>`}
if(v==='lessons'){h+=`<h2>${t('lessons')}</h2>${isT()?`<button class="btn" onclick="addLesson()">＋ ${t('addL')}</button>`:''}${ls.map(l=>`<div class="row"><b>📘 ${l.title}</b><div><button class="btn p" onclick="view(${l.id})">${t('open')}</button>${isT()?` <button class="btn" onclick="delItem('lessons',${l.id})">🗑 ${t('del')}</button>`:''}</div></div>`).join('')||`<p>${t('none')}</p>`}`}
if(v==='exams'){h+=`<h2>${t('exams')}</h2>${isT()?`<button class="btn" onclick="addExam()">＋ ${t('addE')}</button>`:''}${D.exams.map(e=>`<div class="row"><div><b>📄 ${e.title}</b><div class="sm">${new Date(e.end).toLocaleString()} · ${e.dur}m · ${e.tries} ${t('tr')}</div></div><div><button class="btn p" onclick="takeExam(${e.id})">${t('open')}</button>${isT()?` <button class="btn" onclick="delItem('exams',${e.id})">🗑 ${t('del')}</button>`:''}</div></div>`).join('')||`<p>${t('none')}</p>`}`}
if(v==='perf'){const n=Object.keys(D.att).filter(k=>k.startsWith(S.user.id+':')).reduce((s,k)=>s+D.att[k],0);h+=`<h2>${t('perf')}</h2><div class="grid"><div class="sq"><span>📖</span><b>${t('lessons')}</b><h2>${ls.length}</h2></div><div class="sq"><span>📄</span><b>${t('exams')}</b><h2>${n}</h2></div></div>`}
if(v==='set'){h+=`<h2>${t('set')}</h2><div class="row"><b>${t('lang')}</b><select style="width:auto" onchange="S.lang=this.value;LS.s('lang',S.lang);R()"><option value="ar" ${S.lang==='ar'?'selected':''}>العربية</option><option value="en" ${S.lang==='en'?'selected':''}>English</option></select></div><div class="row"><b>${t('theme')}</b><div><button class="btn g" onclick="S.theme='light';LS.s('theme','light');R()">☀️ ${t('light')}</button> <button class="btn g" onclick="S.theme='dark';LS.s('theme','dark');R()">🌙 ${t('dark')}</button></div></div>`}
if(v==='students'){h+=`<h2>${t('students')}</h2><div class="sbar">🔍<input placeholder="${t('search')}" oninput="stFilter(this.value)"></div><div id="st">${stList('')}</div>`}
return h+'</div>'}
function stList(q){const f=D.users.filter(u=>(u.fn+' '+u.sn+' '+u.fam+' '+u.u).toLowerCase().includes(q.toLowerCase()));
return f.map(u=>{const b=u.ban&&u.ban>Date.now();return `<div class="row"><div><b>${u.fn} ${u.sn} ${u.fam}</b><div class="sm">${u.gr} · ${u.ph} · 👨 ${u.fp} · 👩 ${u.mp}<br>${u.gm}${b?`<br><span style="color:var(--red)">${t('banned')} ${new Date(u.ban).toLocaleString()}</span>`:''}</div></div><div><button class="btn p" onclick="allow('${u.id}')">＋</button> <button class="btn" onclick="ban('${u.id}')">${b?t('unban'):'⛔ '+t('ban')}</button></div></div>`}).join('')||`<p>${t('nf')}</p>`}
function stFilter(q){$('#st').innerHTML=stList(q)}
function doLogin(){const u=$('#u').value.trim(),p=$('#p').value,e=$('#e');
if(u==='1112'&&p==='240011')return enter({id:'T',role:'t'});
const x=D.users.find(z=>z.u===u&&z.p===p);if(p.length<6||!x){e.textContent=t('bad');return}
if(x.ban&&x.ban>Date.now()){e.textContent=t('banned')+' '+new Date(x.ban).toLocaleString();return}
enter({id:x.id,role:'s'})}
function enter(s){S.user=s;if($('#rm')&&$('#rm').checked)LS.s('sess',s);go('home')}
function gLogin(){const m=(prompt(t('gm'))||'').trim().toLowerCase();if(!m)return;const x=D.users.find(z=>z.gm.toLowerCase()===m);
if(!x){$('#e').textContent=t('ggl');return}if(x.ban&&x.ban>Date.now()){$('#e').textContent=t('banned');return}enter({id:x.id,role:'s'})}
function doSignup(){const ids=['fn','sn','fam','gr','fp','mp','ph','gm','u','p'],v={};ids.forEach(i=>v[i]=$('#'+i).value.trim());const e=$('#e');
if(ids.some(i=>!v[i])||v.p.length<6||!v.gm.includes('@')){e.textContent=t('req');return}
if(D.users.some(z=>z.u===v.u)||v.u==='1112'){e.textContent=t('taken');return}
v.id='s'+Date.now();v.ok=[];v.ban=0;D.users.push(v);save();enter({id:v.id,role:'s'})}
function logout(){S.user=null;LS.s('sess',null);go('intro')}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const c=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=c}}return m[b.length]}
function doSearch(){const q=S.q.trim().toLowerCase(),r=$('#res');if(!q){r.innerHTML='';return}
const ls=vis(),hit=ls.filter(l=>l.title.toLowerCase().includes(q));let out=hit,note='';
if(!hit.length&&ls.length){const best=ls.map(l=>({l,d:Math.min(...l.title.toLowerCase().split(/\s+/).map(w=>lev(q,w)))})).sort((a,b)=>a.d-b.d)[0];out=[best.l];note=t('best')+': '}
r.innerHTML=out.map(l=>`<div class="row"><b>${note}📘 ${l.title}</b><button class="btn p" onclick="view(${l.id})">${t('open')}</button></div>`).join('')||`<p>${t('nf')}</p>`}
function modal(h){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div>${h}<p><button class="btn g" onclick="this.closest('.mod').remove()">${t('close')}</button></p></div>`;document.body.appendChild(m);return m}
function view(id){const l=D.lessons.find(x=>x.id===id);modal(`<h3>${l.title}</h3>${l.v?`<video controls src="${l.v}"></video>`:''}${l.p?`<iframe style="height:60vh" src="${l.p}"></iframe>`:''}${!l.v&&!l.p?`<p class="sm">—</p>`:''}`)}
function addLesson(){modal(`<h3>${t('addL')}</h3>${field('lt','title')}<label class="sm">${t('video')}</label><input id="lv" type="file" accept="video/*"><label class="sm">${t('pdf')}</label><input id="lp" type="file" accept="application/pdf"><button class="btn" onclick="saveLesson(this)">${t('save')}</button>`)}
function saveLesson(b){const ti=$('#lt').value.trim();if(!ti)return;const f=i=>$(i).files[0]?URL.createObjectURL($(i).files[0]):null;
D.lessons.push({id:Date.now(),title:ti,v:f('#lv'),p:f('#lp')});save();b.closest('.mod').remove();R()}
function delItem(k,id){if(!confirm(t('del')+'؟'))return;D[k]=D[k].filter(x=>x.id!==id);save();R()}
function allow(uid){const u=D.users.find(x=>x.id===uid);modal(`<h3>${t('allow')}</h3>${D.lessons.map(l=>`<label class="row"><span>${l.title}</span><input type="checkbox" style="width:auto" ${u.ok.includes(l.id)?'checked':''} onchange="tog('${uid}',${l.id},this.checked)"></label>`).join('')}`)}
function tog(uid,lid,on){const u=D.users.find(x=>x.id===uid);u.ok=u.ok.filter(i=>i!==lid);if(on)u.ok.push(lid);save()}
function ban(uid){const u=D.users.find(x=>x.id===uid);u.ban=(u.ban&&u.ban>Date.now())?0:Date.now()+864e5;save();R()}
function addExam(){modal(`<h3>${t('addE')}</h3>${field('et','title')}<label class="sm">${t('end')}</label><input id="ee" type="datetime-local">${field('ed','dur','number')}${field('en','tries','number')}<button class="btn" onclick="saveExam(this)">${t('save')}</button>`)}
function saveExam(b){const x={id:Date.now(),title:$('#et').value.trim(),end:new Date($('#ee').value).getTime(),dur:+$('#ed').value,tries:+$('#en').value};
if(!x.title||!x.end||!x.dur||!x.tries)return;D.exams.push(x);save();b.closest('.mod').remove();R()}
function takeExam(id){const e=D.exams.find(x=>x.id===id);if(isT()){modal(`<h3>${e.title}</h3>`);return}
const k=S.user.id+':'+id,n=D.att[k]||0;if(Date.now()>e.end)return modal(`<p>${t('closed')}</p>`);if(n>=e.tries)return modal(`<p>${t('nomore')}</p>`);
D.att[k]=n+1;save();modal(`<h3>${e.title}</h3><p>${t('started')} ${e.dur}</p><p class="sm">${n+1} / ${e.tries}</p>`)}
if(S.user)S.view='home';theme();R();
</script></body></html>
